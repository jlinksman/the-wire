bloc_names:
  gov: Netanyahu's bloc
  opp: Opposition
  arab: Arab parties
lists:
- id: likud
  name: Likud
  short: Likud
  leader: Benjamin Netanyahu
  bloc: gov
  poll_name: Likud
  what: The governing national-conservative party led by Prime Minister Netanyahu. It opposes a Palestinian state, conditions further Gaza withdrawal on Hamas's disarmament, supports West Bank settlement and continued Israeli security control.
  sources:
  - https://en.wikipedia.org/wiki/2026_Israeli_legislative_election
  - https://israelpolicyforum.org/onetwenty/
- id: together
  name: Together (B'Yachad / Beyachad)
  short: Together
  leader: Naftali Bennett (list head) and Yair Lapid
  bloc: opp
  poll_name: Together
  what: A centre-right/centrist joint list of former prime ministers Bennett and Lapid. It runs on universal draft, a state commission of inquiry into October 7, cost of living and a constitution; Bennett opposes a Palestinian state and says the list will not rely on Arab parties.
  sources:
  - https://en.wikipedia.org/wiki/Together_(Israel)
  - https://israelpolicyforum.org/onetwenty/
- id: rzp
  name: Religious Zionism – Zehut
  short: RZ–Zehut
  leader: Bezalel Smotrich (with Moshe Feiglin of Zehut)
  bloc: gov
  poll_name: RZP–Zehut
  what: The religious-nationalist settler party of Finance Minister Smotrich, running with Feiglin's libertarian Zehut. It seeks full Israeli sovereignty over the West Bank, expanded settlement and a larger role for Jewish values in public life, and opposes a Palestinian state.
  sources:
  - https://israelpolicyforum.org/onetwenty/
  - https://www.ynetnews.com/article/h1dpvu9cgl
- id: otzma
  name: Otzma Yehudit (Jewish Power)
  short: Otzma
  leader: Itamar Ben-Gvir
  bloc: gov
  poll_name: Otzma
  what: A far-right nationalist party led by National Security Minister Ben-Gvir. It sponsored the 2026 death-penalty-for-terrorists law, backs sovereignty over the West Bank, Israeli military control of Gaza and 'voluntary emigration' of Palestinians, and seeks to bar Arab parties from the Knesset.
  sources:
  - https://www.jpost.com/israel-election-2026/article-909348
  - https://israelpolicyforum.org/onetwenty/
- id: shas
  name: Shas
  short: Shas
  leader: Aryeh Deri
  bloc: gov
  poll_name: Shas
  what: The Sephardi/Mizrahi Haredi party. Its central demand is a law preserving draft exemptions for yeshiva students, alongside welfare spending and the state's traditional religious character; it opposes a Palestinian state. Quit its government posts in July 2025 over the draft law, but polls count it in the pro-Netanyahu bloc.
  sources:
  - https://israelpolicyforum.org/onetwenty/
  - https://www.timesofisrael.com/deri-says-like-utj-shas-wont-join-next-government-without-a-draft-exemption-law/
- id: utj
  name: United Torah Judaism
  short: UTJ
  leader: Yaakov Asher
  bloc: gov
  poll_name: UTJ
  what: The Ashkenazi Haredi alliance. Its priorities are preserving yeshiva students' draft exemptions, funding Torah institutions and the religious status quo, including on Shabbat; it has no unified West Bank position. Both factions left the government in July 2025 and Asher says UTJ 'does not belong to any bloc'; polls and IPF still count it in Netanyahu's bloc. Wikipedia's election page lists it with the opposition.
  sources:
  - https://israelpolicyforum.org/onetwenty/
  - https://jpost.com/israel-news/politics-and-diplomacy/article-907655
- id: yb
  name: Yisrael Beiteinu
  short: Yisrael Beiteinu
  leader: Avigdor Lieberman
  bloc: opp
  poll_name: Yisrael Beiteinu
  what: 'A secular right-wing party with roots among former-Soviet immigrants. It is hawkish on security (sovereignty over Area C, a tougher line on Iran, death penalty for terrorists) and strongly secular at home: universal draft, civil marriage and local choice on Shabbat transport; it rules out Arab and Haredi parties as partners.'
  sources:
  - https://www.jpost.com/israel-election-2026/article-906447
  - https://israelpolicyforum.org/onetwenty/
- id: raam
  name: Ra'am (United Arab List)
  short: Ra'am
  leader: Mansour Abbas
  bloc: arab
  poll_name: Ra'am
  what: A conservative Islamist Arab party focused on the practical interests of Arab citizens such as crime and services. It joined the 2021-22 Bennett-Lapid coalition, is open to joining governments again, and supports a negotiated two-state solution.
  sources:
  - https://israelpolicyforum.org/onetwenty/
  - https://www.ynetnews.com/article/h1dpvu9cgl
- id: joint
  name: The Joint List (Hadash–Ta'al–Balad)
  short: Joint List
  leader: Yousef Jabareen (Hadash), with Ahmad Tibi (Ta'al)
  bloc: arab
  poll_name: Joint List
  what: 'An alliance of secular Arab-led parties: socialist Arab-Jewish Hadash, Ta''al and Arab-nationalist Balad. It opposes the Gaza war, settlements and annexation, supports Palestinian statehood (Balad favours a ''state of all its citizens''), and on principle does not join coalitions, though it could back a non-Netanyahu government from outside.'
  sources:
  - https://israelpolicyforum.org/onetwenty/
  - https://unpacked.media/israel-elections-2026-a-guide-to-the-parties-candidates-and-issues/
- id: dems
  name: The Democrats
  short: Democrats
  leader: Yair Golan
  bloc: opp
  poll_name: Dems
  what: The Zionist left, a social-democratic and liberal merger of Labor and Meretz. It backs universal service, a constitution, civil marriage and limited Shabbat transport, opposes annexation, sees separation from the Palestinians as a long-term goal, and is the only Jewish party openly willing to include an Arab party in a coalition.
  sources:
  - https://en.idi.org.il/israeli-elections-and-parties/parties/the-democrats/
  - https://www.jpost.com/israel-election-2026/article-910100
- id: yashar
  name: Yashar! (Gadi Eisenkot)
  short: Yashar
  leader: Gadi Eisenkot
  bloc: opp
  poll_name: Yashar
  what: A centrist, security-focused list led by former IDF chief of staff Eisenkot, leading recent polls. It promises a state commission of inquiry into October 7, 'service for all', and an end to Hamas rule in Gaza; it says a Palestinian state is not on its agenda and sets conditions that currently exclude Arab parties.
  sources:
  - https://en.idi.org.il/israeli-elections-and-parties/parties/yashar/
  - https://israelpolicyforum.org/onetwenty/
- id: reservists
  name: The Reservists – New Economic Party
  short: Reservists
  leader: Yoaz Hendel, with co-chair Yaron Zelekha
  bloc: opp
  poll_name: Reserv.–NEP
  what: A centre-right list built around reserve soldiers and universal conscription with sanctions on evaders, plus anti-monopoly economics. It opposes a Palestinian state, supports settlement, wants a state commission into October 7, and calls for a 'Zionist unity government' without Arab or Haredi parties. Formally joins no bloc and has not ruled out Netanyahu; ToI polls count it in neither bloc. Coded 'opp' only because it is outside the current government.
  sources:
  - https://en.wikipedia.org/wiki/The_Reservists_(political_party)
  - https://www.timesofisrael.com/liveblog_entry/hendel-makes-universal-draft-a-condition-for-joining-government-slams-pm-as-well-as-rivals/
