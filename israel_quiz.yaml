# Israel match (2026-10-24): which lists in Israel's October 27, 2026 Knesset election Joe's views sit
# closest to. Statements and explainers written in Claude sessions; each list coded on a statement only
# where a source (platform, leader's statement, Knesset vote, reliable reporting) shows its position,
# never from its bloc. Roster from Wikipedia's election page, IDI, Israel Policy Forum and the Times of
# Israel (2026-10-24). Answers are private (KV quiz.json, id il_2026). Shipped as data.il_quiz.
title: Israel match
election: '2026-10-27'
