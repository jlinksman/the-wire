stances:
  likud:
    il01:
      v: -2
      source: https://israelpolicyforum.org/onetwenty/
      note: 'IPF: Likud ''opposes the establishment of a Palestinian state''.'
      verified: true
    il02:
      v: 1
      source: https://www.timesofisrael.com/knesset-votes-71-13-for-non-binding-motion-calling-to-annex-west-bank/
      note: Likud backed the July 2025 non-binding annexation motion (71-13) but boycotted the Oct 2025 binding bill on timing/US grounds (ToI, ANX); Netanyahu not prepared to annex the whole West Bank.
      verified: true
    il03:
      v: -2
      source: https://unpacked.media/israel-elections-2026-a-guide-to-the-parties-candidates-and-issues/
      note: Unpacked lists 'support for the settlements in the West Bank'.
      verified: true
    il04:
      v: 2
      source: https://israelpolicyforum.org/onetwenty/
      note: Conditions further withdrawal from the Yellow Line on Hamas's disarmament and the Strip's demilitarization; Netanyahu ordered control extended to 70% (May 2026).
      verified: true
    il05:
      v: -2
      source: https://israelpolicyforum.org/onetwenty/
      note: Opposes transferring postwar Gaza control to the PA.
      verified: true
    il06:
      v: 1
      source: https://en.wikipedia.org/wiki/2025_United_States_strikes_on_Iranian_nuclear_sites
      note: Netanyahu launched the June 13, 2025 strikes alone; the US joined only on June 22. JPost (Oct 2026) judges him more willing than Eisenkot to take risk on Iran.
      verified: true
    il07:
      v: -2
      source: https://www.ynetnews.com/article/hkqfct9qgx
      note: Coalition bill by Likud MK Kallner for a politically appointed panel passed 1st reading July 2026; Netanyahu has resisted a state commission (IPF).
      verified: true
    il08:
      v: 1
      source: https://en.wikipedia.org/wiki/Death_Penalty_for_Terrorists_Law
      note: Voted for the March 2026 law; Netanyahu backed it after earlier reservations (ToI).
      verified: true
    il10:
      v: -2
      source: https://www.ksat.com/news/world/2026/10/16/israels-arab-led-parties-could-decide-the-election-if-anyone-would-partner-with-them/
      note: 'AP: Netanyahu says he won''t form a coalition with any Arab-led party; Likud also petitioned to disqualify the Arab lists (Al Jazeera).'
      verified: true
    il11:
      v: -1
      source: https://www.timesofisrael.com/bismuth-presents-bill-exempting-yeshiva-students-from-idf-draft-loosening-sanctions/
      note: Likud MK Bismuth's coalition bill keeps full-time yeshiva exemptions with phased targets and looser sanctions.
      verified: true
    il12:
      v: -1
      source: https://www.ynetnews.com/article/hkd6el4ogg
      note: 'Ynet (Oct 2026): Likud opposes local Shabbat transport ''to preserve the status quo''.'
      verified: true
    il13:
      v: -1
      source: https://www.jpost.com/israel-election-2026/article-911432
      note: 'JPost explainer (Oct 2026): Likud''s record on marriage, conversion and Shabbat leans toward ''preserving existing religious arrangements'' rather than ''broad liberalization''. No explicit civil-marriage plank.'
      verified: true
    il14:
      v: 1
      source: https://www.timesofisrael.com/shas-quits-its-coalition-posts-to-protest-failure-to-legislate-haredi-draft-exemption/
      note: Likud's Bismuth framework (Oct 2025) would cut yeshiva funding only if enlistment quotas are missed after a year; the coalition voted down opposition bills penalizing draft-evading yeshiva students. Netanyahu revived the exemption bill in May 2026 (ToI) and called arrests of draft evaders 'unacceptable'.
      verified: true
    il18:
      v: 2
      source: https://www.jpost.com/israel-election-2026/article-911432
      note: Justice Minister Yariv Levin's package sought 'greater political influence over judicial appointments'; the March 2025 Judicial Selection Law (Globes) passed with the coalition's majority. Likud declined Ynet's questionnaire.
      verified: true
    il19:
      v: -1
      source: https://www.jpost.com/israel-election-2026/article-911432
      note: Levin's package proposed 'restrictions on judicial review'; the explainer gives no current Likud override position.
      verified: true
    il20:
      v: 2
      source: https://www.jpost.com/israel-election-2026/article-911432
      note: The Likud-led cabinet voted to dismiss AG Baharav-Miara in Aug 2025, and ministers and candidates still call for her dismissal. Levin called the AG institution 'corrupted to its core' and backs the bill to split the role (ToI, Dec 2025).
      verified: true
    il21:
      v: -2
      source: https://www.timesofisrael.com/everything-you-need-to-know-tois-guide-to-the-37-parties-that-israelis-can-finally-choose-from/amp/
      note: Likud is led by Netanyahu, who has been under indictment since 2020 and calls the charges a 'witch hunt'. He is running for PM again while on trial.
      verified: true
    il25:
      v: 1
      source: https://www.jpost.com/israel-news/article-891046
      note: 'Proxy: the Likud-led government backed the Religious Courts Arbitration Law (passed 65-41, Mar 24, 2026), which lets rabbinic courts arbitrate civil disputes; Lapid called Likud a ''doormat'' for the haredim. No Likud platform statement.'
      coder: B
    il26:
      v: 1
      source: https://jta.org/?p=1503673
      note: 'Proxy: the Likud-led coalition passed the 2018 ''mini-markets'' law (58-57) letting the interior minister void new bylaws for Shabbat opening; JPost (Oct 2026): Likud''s record points toward ''preserving existing religious arrangements''. Dated, so +1.'
      coder: B
    il27:
      v: 1
      source: https://www.jpost.com/israel-election-2026/article-911432
      note: 'JPost: Likud''s socio-economic platform ''emphasizes lower taxes, competition'' and a pro-market approach favoring ''limited government intervention''. Its own government raised VAT to 18% (Jan 2025) and defense spending, so +1.'
      coder: B
    il28:
      v: 1
      source: https://unpacked.media/israel-elections-2026-a-guide-to-the-parties-candidates-and-issues/
      note: 'Unpacked: Likud ''emphasizes free-market economics with minimal government intervention''; AP: ''liberal economic policies''. Its government is preparing IAI/Rafael IPOs (Algemeiner/Reuters, Jan 2026). No explicit 2026 privatization plank, so +1.'
      coder: B
  together:
    il01:
      v: -2
      source: https://www.ynetnews.com/article/h1dpvu9cgl
      note: 'Questionnaire: ''We oppose a Palestinian state and the transfer of territory.'' Bennett is the list head; Lapid has cooled on two states (JTA).'
      verified: true
    il02:
      v: 1
      source: https://www.ynetnews.com/article/h1dpvu9cgl
      note: Cites Bennett's plan in which Area C is viewed as a future sovereign part of Israel; Lapid voted for the Ma'ale Adumim bill but against the broad bill (ToI).
      verified: true
    il03:
      v: -2
      source: https://www.ynetnews.com/article/h1dpvu9cgl
      note: '''We support Jewish settlement anywhere it is carried out legally''; opposes illegal outposts and settler violence (IPF).'
      verified: true
    il04:
      v: 1
      source: https://israelpolicyforum.org/onetwenty/
      note: Backs freedom of military action until Hamas is disarmed and keeping Israel on the Yellow Line; Bennett wants a 'significant security zone' but says disarming Hamas needs diplomacy too (JPost).
      verified: true
    il05:
      v: 1
      source: https://www.jpost.com/israel-news/article-906838
      note: Bennett is 'willing to give the PA some role in Gaza', with Egypt central (JPost, Aug 2026).
      verified: true
    il07:
      v: 2
      source: https://en.wikipedia.org/wiki/Together_(Israel)
      note: Bennett says forming a state commission would be his government's first action; Lapid pledged one in the first month (Ynet).
      verified: true
    il09:
      v: -2
      source: https://www.middleeasteye.net/news/ahead-israel-elections-bennett-rejects-two-state-solution-eisenkot-surges-polls
      note: 'Bennett (July 2026): will not allow a Palestinian state even at the cost of Saudi normalization.'
      verified: true
    il10:
      v: -2
      source: https://arabcenterdc.org/resource/israels-election-and-eisenkots-arab-coalition-dilemma/
      note: 'Bennett: ''the Arab parties are not Zionist, and therefore we will not rely on them''; Lapid said he would not form another coalition with Ra''am (AP).'
      verified: true
    il11:
      v: 2
      source: https://en.wikipedia.org/wiki/Together_(Israel)
      note: Both leaders support mandatory Haredi conscription; Bennett pledges to investigate 'sabotage of Haredi enlistment'.
      verified: true
    il12:
      v: 1
      source: https://www.timesofisrael.com/liveblog_entry/ex-pm-bennett-backs-public-transport-on-shabbat-civil-marriage-sparking-haredi-backlash/
      note: 'Bennett (Apr 2026): ''cities must be allowed to choose'' Shabbat public transport; local-option, not national service.'
      verified: true
    il13:
      v: 2
      source: https://jpost.com/israel-election-2026/article-908711
      note: 'Lapid (No. 2): ''In the State of Israel, there should be a parallel civil marriage option for anyone who wants it.'' The JPost B''Yachad explainer also has marriage performed ''rather than through the Chief Rabbinate''.'
      verified: true
    il14:
      v: -2
      source: https://www.jpost.com/israel-election-2026/article-910703
      note: 'Platform: end state funding for draft evasion and ''no exemptions to haredim who evade IDF service''.'
      verified: true
    il15:
      v: -1
      source: https://www.jpost.com/israel-election-2026/article-910703
      note: Opposes the Rabbinate's role in marriage and calls for 'greater competition in kosher certification'. Conversion is not addressed.
      verified: true
    il16:
      v: 2
      source: https://www.ynetnews.com/article/bjvkbbsfmx
      note: Plan for an Interior Ministry civil partnership open to all couples regardless of gender, with marital rights. Lapid pledges an equal-rights-for-all-couples law in the first 100 days (JPost). Ynet says Bennett's personal view on same-sex marriage itself is unclear.
      verified: true
    il17:
      v: 2
      source: https://www.jpost.com/israel-election-2026/article-910703
      note: Bennett opposes state funding for 'education without core subjects'.
      verified: true
    il18:
      v: -2
      source: https://www.ynetnews.com/article/hkcjtk1cme
      note: Would repeal the new judicial appointments law, which it says would politicize the courts.
      verified: true
    il19:
      v: 1
      source: https://www.ynetnews.com/article/hkcjtk1cme
      note: 'Would pass a Basic Law: Legislation specifying when the Supreme Court may intervene, which keeps judicial review but defines its limits.'
      verified: true
    il24:
      v: 2
      source: https://www.jpost.com/israel-election-2026/article-910703
      note: Would break up monopolies, stop exclusive importers from taking on more major brands, and require Shufersal to sell stores where it limits competition. Banks are not addressed.
      verified: true
    il08:
      v: -1
      source: https://en.wikipedia.org/wiki/Death_Penalty_for_Terrorists_Law
      note: 'Component vote: Yesh Atid voted against the March 2026 law and filed a legal challenge (Wikipedia). No Bennett statement found, so -1.'
      coder: B
    il25:
      v: -2
      source: https://www.jpost.com/israel-news/article-891046
      note: 'Bennett called the rabbinic-courts arbitration law ''disgraceful'' and vowed his government would repeal it; Lapid: ''the day the status quo died'' / ''a halachic state''.'
      coder: B
    il28:
      v: 1
      source: https://www.ynetnews.com/article/hkd6el4ogg
      note: 'Proxy: Beyachad''s transport plan calls ''for the private sector to take over implementation of major infrastructure projects'' (Ynet). No general privatization plank.'
      coder: B
  rzp:
    il01:
      v: -2
      source: https://www.ynetnews.com/article/h1dpvu9cgl
      note: Says its policies have 'in practice, eliminated the idea of a Palestinian state'.
      verified: true
    il02:
      v: 2
      source: https://www.ynetnews.com/article/h1dpvu9cgl
      note: '''Supports applying full Israeli sovereignty over Judea and Samaria.'''
      verified: true
    il03:
      v: -2
      source: https://www.ynetnews.com/article/h1dpvu9cgl
      note: Touts approving 3,401 E1 units and 104 new communities; backs full regularization of outposts.
      verified: true
    il04:
      v: 2
      source: https://www.jns.org/news/israel-news/smotrich-urges-permanent-israeli-sovereignty-in-gaza-lebanon
      note: 'JNS (Oct 2026): Smotrich urges permanent Israeli sovereignty in Gaza; Zehut also backs sovereignty over Gaza (IPF).'
      verified: true
