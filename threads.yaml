# Standing threads: areas of law The Wire tracks whether or not they are followed
# (BRIEF.md, stage 3). Each accrues decisions, rules and notices as developments and
# never goes dormant or forgotten. They appear under "Areas of law" on the Law tab.
#
# pattern: comma-separated terms matched whole-word against a report's headline and the
# first 300 characters of its description; a trailing * matches endings (brownfield*).
# Keep patterns specific: a standing thread that matches everything tracks nothing.
standing:
  - id: law_navigation_spill
    title: "Navigation Law Article 12 and the Oil Spill Fund"
    kind: law
    desk: LAW
    pattern: "Navigation Law, Oil Spill Fund, Article 12, petroleum bulk storage, Part 613, 6 NYCRR 613, spill fund, strict liability discharge"
  - id: law_pfas_ny
    title: "PFAS regulation in New York"
    kind: law
    desk: LAW
    pattern: "PFAS, PFOA, PFOS, forever chemical*, perfluoro*, polyfluoro*"
  - id: law_brownfields
    title: "Brownfields and site remediation"
    kind: law
    desk: LAW
    pattern: "brownfield*, Brownfield Cleanup Program, remedial action, remediation site, Superfund, CERCLA, RCRA, consent decree, record of decision"
  - id: law_bankruptcy
    title: "Bankruptcy and restructuring"
    kind: law
    desk: LAW
    pattern: "Chapter 11, Chapter 7, Chapter 15, bankruptcy court, Bankr., debtor in possession, automatic stay, creditors' committee, restructuring support agreement"
  - id: law_fincen_boi
    title: "FinCEN and beneficial ownership"
    kind: law
    desk: LAW
    pattern: "FinCEN, beneficial ownership, Corporate Transparency Act, Bank Secrecy Act, anti-money laundering, AML, suspicious activity report*"
  - id: law_2d_dept_land_use
    title: "Land use and zoning in the Second Department"
    kind: law
    desk: LAW
    pattern: "zoning board, planning board, site plan, variance, SEQRA, Article 78, rezon*, special use permit, subdivision approval, area variance, use variance"
