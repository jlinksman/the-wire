  now: The State Common Retirement Fund was worth about $309.7 billion in August 2026. Its In-State Private Equity Program had committed $2.64 billion and invested $1.9 billion in about 600 New York companies as of March 2025, with roughly a 10% return; separate programs fund small-business loans and affordable housing. Republican comptroller candidate Joseph Hernandez proposes setting aside $10 billion to invest in the state, with a focus on upstate. Incumbent Tom DiNapoli stresses diversification and his fiduciary duty as sole trustee.
