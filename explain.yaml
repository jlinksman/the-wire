  now: 'Gov. Hochul''s 2026 ''Let Them Build'' agenda argued that red tape is slowing housing, and the budget enacted in May 2026 exempted much new housing from state environmental review. Other cost drivers are also in the debate: an industry study found insurance per affordable unit rose from $712 to $1,495 between 2017 and 2024. Landlord groups blame the 2019 rent law. Contractors blame the Scaffold Law for high construction insurance.'
