  now: On July 14, 2026, Gov. Hochul signed an executive order pausing large new data centers (50 megawatts or more) for up to a year while the state writes environmental standards, citing the risk of higher utility bills. The Legislature had passed a broader bill in early June, Sen. Kristen Gonzalez's S10642, covering centers over 20 megawatts and adding a separate utility rate for data centers. As of mid-July 2026 that bill still awaited Hochul's decision. More than 12 gigawatts of very large loads, including data centers, were seeking to connect to the state grid as of May.
  case_for: Hochul, Sen. Gonzalez, Assembly Speaker Heastie and environmental groups argue the state should not approve huge new power users until it knows how they will affect grid costs and household bills. They say a pause gives time to make data centers pay their own way.
  case_against: Data center firms such as Digital Realty and many building trades unions argue a pause will push investment and union jobs to other states. Republicans such as Assemblyman Scott Gray say rules can be written without stopping projects, and that a moratorium sends a signal that New York is closed for business.
