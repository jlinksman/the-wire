  now: The New York Health Act (S3425 in the Senate, sponsored by Sen. Gustavo Rivera, with A1466 in the Assembly) would create a single public health plan covering every state resident. It has dozens of Senate co-sponsors but remains in the Senate Health Committee, where it was re-referred on Jan. 7, 2026, and has not reached a floor vote. Separately, the Comptroller projects federal changes enacted in July 2025 will cut federal support for state health programs, with the Essential Plan taking the largest hit.
  case_for: Sen. Rivera, nurses' unions and single-payer advocates argue one public plan would cover everyone, end medical debt and cut administrative waste. They say it would be cheaper overall than the current mix of private insurers, especially as federal cuts shrink coverage.
  case_against: Business groups, insurers and many moderate Democrats argue the plan would require very large new taxes and disrupt coverage for people who like their current plans. They also question whether the state could fund it without federal cooperation, given its projected budget gaps.
