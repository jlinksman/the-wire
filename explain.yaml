# Explainers for questionnaire statements (2026-10-23; election statements q19-q44 added 2026-10-24),
# shown by "What's this about?" before answering. Written in Claude sessions from the sources listed
# under each (all opened and checked); neutral by rule: the case for agreeing and for disagreeing get
# equal space, and nothing says how an answer is counted. The build adds the newest matching coverage
# (pipeline/explain.py). Refresh before each election and each annual values take.
q01:
  now: Sen. Michelle Hinchey and Assemblymember Sarahana Shrestha sponsor the Hudson Valley Power Authority Act (S2026A / A2127A). It would create a public authority able to buy Central Hudson and run it as a public utility, with a goal that households spend no more than 6% of income on energy. The bill was re-referred to committee on Jan. 7, 2026 and has not had a floor vote. Central Hudson, owned by Canada's Fortis, says it is 'not for sale.' Meanwhile the PSC approved three years of electric delivery increases in August 2025 ($29.7M, $31.6M and $34.5M).
  case_for: Sponsors Hinchey and Shrestha argue that a nonprofit public owner without shareholder profits would hold rates down over time, and they cite public utilities whose rates have risen more slowly than private ones. Supporters also point to Central Hudson's billing failures and repeated rate increases as evidence that private ownership has not served customers.
  case_against: Central Hudson calls the plan a 'multibillion-dollar gamble' that would make customers and taxpayers pay for costly asset purchases with no guarantee of lower bills or better service. Some labor leaders, including IBEW Local 320's president, have said they are not convinced a takeover would help customers or workers.
  terms:
  - Central Hudson
  - public power
  - Hudson Valley Power Authority
  - municipalization
  - Hinchey Shrestha
  - rate hike
  sources:
  - https://nysenate.gov/legislation/bills/2025/S2026
  - https://www.dailygazette.com/hv360/central-hudson-takeover-by-state-authority/article_b24604e2-e4c9-460a-a9af-64a4569a4373.html
  - https://dps.ny.gov/central-hudson-electric-rate-case-summary
  - https://www.renewableenergyworld.com/energy-business/policy-and-regulation/public-power-push-spreads-to-new-yorks-hudson-valley/
