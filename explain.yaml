  now: New York is the only state that holds contractors and property owners strictly liable when a worker is hurt in a gravity-related fall, under a law more than 100 years old. As of September 2026 there is no formal state reform proposal; a Hochul spokesperson said she will lay out her agenda in January, though housing advocates say she is interested. A federal bill from Rep. Nick Langworthy would preempt the law on federally funded projects.
  case_for: The New York State Trial Lawyers Association and its worker-safety and labor allies argue the law puts the cost of serious injuries on those who profit from the work instead of on injured workers and taxpayers. They say insurers and real estate interests are misrepresenting the facts, and that delayed and denied claims are the real problem.
  case_against: Contractor groups such as the Associated General Contractors of New York and the Building Trades Employers' Association argue the law makes construction insurance 200% to 500% more costly than in nearby states and invites fraud. The New York State Association for Affordable Housing is building a coalition for reform, saying the law raises the cost of building housing.
