  now: Attorney General Letitia James, a Democrat, faces Republican Saritha Komatireddy, a longtime federal prosecutor endorsed by President Trump, on Nov. 3. Komatireddy says safety is the attorney general's duty, that the state needs 'a prosecutor in charge,' and that James's civil fraud case against Trump was politically motivated; an appeals court vacated the roughly $500 million penalty in that case. James defends her record of civil suits, including many against the Trump administration. Most street crime is handled by local district attorneys, not the attorney general.
  case_for: Komatireddy argues the office should use its criminal tools more, naming Medicaid fraud and public safety as priorities, and says James has made New York less safe while pursuing political cases. Supporters say a former prosecutor would put the office's resources toward crimes that directly harm New Yorkers.
  case_against: 'James and her supporters argue the office''s greatest strength is civil enforcement: consumer protection, fraud and lawsuits that recover money and stop harmful federal or corporate conduct. They note that district attorneys already handle most criminal cases, so shifting resources would leave civil work undone.'
