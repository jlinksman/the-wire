  now: The State Common Retirement Fund held $267.8 million in Israel bonds as of October 2023, under 1% of a fund now worth about $310 billion; Comptroller Tom DiNapoli says the holding dates to 1991, has beaten Treasuries and is not political. In the June 23, 2026 Democratic primary, challengers Raj Goyle and Drew Warshaw both called for divesting, and DiNapoli won with about 65% of the vote. He now faces Republican Joseph Hernandez on Nov. 3. In New York City, Mayor Mamdani has signaled divestment while Comptroller Mark Levine opposes it.
  case_for: DiNapoli argues the bonds are a sound, long-held investment that has outperformed US Treasuries, and that divestment should be a last resort. Supporters say pulling out would bring politics into a fund that should be managed for retirees.
  case_against: Goyle argued during the primary that a state pension fund should not hold foreign government bonds, and he and other critics say Israel bonds tie retirees' money to a government at war. Warshaw called for selling all foreign government bonds, not just Israel's.
