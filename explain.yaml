  now: 'This is now law. Gov. Hochul signed the FAIR Business Practices Act on Dec. 19, 2025, after it passed in June 2025, expanding the state''s main consumer law to ban ''unfair'' and ''abusive'' practices, not only deceptive ones. A chapter amendment signed March 27, 2026 narrowed it: unfairness now follows the federal FTC standard, only the Attorney General can sue over unfair or abusive conduct, and private lawsuits stay limited to deception. The question now is whether to keep, expand or roll back that power.'
