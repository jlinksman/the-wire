  now: Under a 2016 agreement covering 2019 through 2028, the US pledged $38 billion in military aid to Israel, about $3.8 billion a year, including missile defense. On July 15, 2026 the House rejected Rep. Thomas Massie's amendment to cut the roughly $3.3 billion in annual grants, 314 to 104; 103 Democrats voted yes, including Hudson Valley Rep. Pat Ryan, while Minority Leader Hakeem Jeffries said beforehand he would oppose it. As of June 2026 the US and Israel were reportedly negotiating the next agreement, and Prime Minister Netanyahu has talked about phasing grants out.
