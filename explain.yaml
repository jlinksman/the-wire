  now: 'The state budget enacted in late May 2026 exempts most new housing from SEQRA review if it is built on previously disturbed land and connects to existing water and sewer. Caps apply: up to 500 units in denser parts of NYC, 300 in other urban areas, 100 in most non-urban areas and 20 in unzoned areas. Larger projects still get full review, and the law adds deadlines of 120 days for exemption decisions and two years to finish an impact statement. The question now is whether to widen these exemptions.'
  case_for: Gov. Hochul, the Regional Plan Association and many affordable housing groups argue SEQRA reviews take years, duplicate local rules and are used in lawsuits to block housing. They cite a state and city study finding that virtually none of more than 1,000 reviewed housing projects had significant environmental impacts.
  case_against: Environmental groups, including the Sierra Club, argue SEQRA is an essential planning tool that lets communities weigh traffic, water and open-space effects before building. They say framing the issue as housing versus the environment is false, and that the 2026 exemptions already went far enough.
