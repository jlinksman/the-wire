  case_against: Housing economists, tenant advocates and trial lawyers argue costs are driven mainly by interest rates, land prices, insurance, labor and materials, including tariffs, which deregulation does not fix. They say many rules protect safety, workers and the environment, and that removing them shifts costs elsewhere.
