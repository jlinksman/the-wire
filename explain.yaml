  now: On Feb. 20, 2026, the US Supreme Court ruled that the emergency powers law (IEEPA) does not let the president impose tariffs, striking down many of them. The administration replaced them with a temporary 10% global tariff, then on July 24, 2026 with new Section 301 tariffs of 10% to 12.5% on goods from 60 economies; steel, auto and other Section 232 tariffs remain. As of August 2026 the Yale Budget Lab put the average tariff rate at 11% and estimated it costs households about $1,100 a year.
  case_for: Democrats in Congress, many importers and retailers, and economists who track prices argue tariffs are a tax paid largely by US buyers and have pushed up the cost of goods. They say lifting them would ease prices for families and businesses that rely on imported parts and materials.
  case_against: The Trump administration and its allies argue tariffs protect US manufacturing, punish unfair trade and forced labor, and give the US leverage in trade deals. They say price effects are modest and that tariff revenue, about $1.9 trillion over ten years by Yale's estimate, helps the federal budget.
