  now: The High Court ruled on June 25, 2024 that there is no legal basis for blanket exemptions; of 3,000 draft orders that July, fewer than 10% reported, and 1,126 arrest warrants followed by November 2024. A coalition bill by Likud's Boaz Bismuth (November 2025) would keep full-time yeshiva exemptions and phase in targets, but it has not passed. In October 2026 Shas and UTJ said they will not join a government that does not enshrine exemptions.
  case_for: Lieberman, Bennett, Lapid, Golan, Eisenkot and Hendel back universal service, and Hendel asks why a group making up a third of the population should be exempt. Hendel would tie housing, mortgage and tax benefits to service, and Lieberman would end yeshiva stipends.
  case_against: Shas and UTJ make a law protecting full-time yeshiva students their condition for joining any government. Religious Zionism supports gradual expansion without coercion, and Likud's Bismuth bill prefers phased targets with milder sanctions that end at age 26.
  sources:
  - https://en.wikipedia.org/wiki/Haredi_conscription_in_Israel
  - https://www.timesofisrael.com/bismuth-presents-bill-exempting-yeshiva-students-from-idf-draft-loosening-sanctions/
  - https://www.timesofisrael.com/deri-says-like-utj-shas-wont-join-next-government-without-a-draft-exemption-law/
  terms: []
il12:
  now: Under the religious status quo, state-run buses and trains do not operate on Shabbat. Some cities fill the gap with free services that fall outside the legal definition of public transport, such as Tel Aviv's 2019 'Naim' minibuses, now in over a dozen municipalities and since February 2026 running to Ben-Gurion Airport.
  case_for: The Democrats, Yisrael Beiteinu and Bennett's Together would let each local authority decide according to its community's character. Tel Aviv deputy mayor Meital Lehavi calls Shabbat service a 'basic, social, and equitable need' and a matter of freedom of movement.
  case_against: Shas accuses supporters of trading away 'our sacred Shabbat,' and UTJ calls it Sabbath desecration. Likud opposes local Shabbat transport to preserve the status quo, and Shas ties the issue to the country's Jewish identity.
  sources:
  - https://jpost.com/israel-news/article-886897
  - https://www.calcalistech.com/ctech/articles/0,7340,L-3774028,00.html
  - https://www.ynetnews.com/article/hkd6el4ogg
  terms: []
il13:
  now: Israel has no civil marriage. Jewish couples marry only through the Chief Rabbinate, and other recognized communities marry through their own religious courts, under a system inherited from Ottoman and British rule. Interfaith couples and people the Rabbinate does not recognize as Jewish cannot marry in Israel. Israel does register civil marriages performed abroad, so many couples marry in Cyprus or online through Utah (Ynet, Sept 2026).
  case_for: 'Together (Lapid: ''a parallel civil marriage option for anyone who wants it''), Yisrael Beytenu and the Democrats argue that citizens shouldn''t need a flight abroad or a rabbi''s approval to marry. They point to immigrants, interfaith couples and secular Israelis, and they cast the issue as ''freedom of religion and freedom from religion''.'
  case_against: Shas and United Torah Judaism argue that a single Orthodox marriage system keeps the Jewish people from splitting into groups that cannot intermarry, and that it protects the state's Jewish character. Likud has tended to preserve existing religious arrangements rather than open civil alternatives.
  sources:
  - https://www.timesofisrael.com/why-is-there-no-civil-marriage-in-israel/
  - https://jpost.com/israel-election-2026/article-908711
  - https://www.jpost.com/israel-election-2026/article-907982
  terms: []
il14:
  now: About 80,000 haredi men aged 18-24 are eligible for the draft but have not enlisted, while the IDF says it needs about 12,000 more recruits (ToI, Oct 2025). The Knesset dissolved in 2026 after the coalition failed to pass a law keeping yeshiva exemptions. On April 26, 2026 the High Court ordered personal sanctions on evaders, including loss of daycare, housing and tax discounts, in place of collective cuts to yeshiva budgets. Haredi enlistment rose from about 1,700 to 2,800 in the past year (IDI).
  case_for: Shas and United Torah Judaism hold that Torah study is itself a service to the Jewish people and want it enshrined in a Basic Law. Netanyahu and Likud have backed a gradual quota framework instead of sanctions, arguing that arrests and funding cuts set back enlistment rather than increase it.
  case_against: 'Together, Yashar, Yisrael Beytenu, the Democrats and the Reservists say public money shouldn''t support men who skip a draft that others serve during a long war. Hendel: ''anyone who doesn''t will receive nothing.'' They cite the IDF''s manpower shortage and the strain on reservists.'
  sources:
  - https://en.idi.org.il/articles/64062
  - https://www.timesofisrael.com/shas-quits-its-coalition-posts-to-protest-failure-to-legislate-haredi-draft-exemption/
  - https://www.timesofisrael.com/as-coalition-collapses-around-him-netanyahu-revives-haredi-draft-exemption-bill/
  terms: []
il15:
  now: On July 15, 2026 the Knesset voted 46-41 to repeal the core of the 2021 kashrut reform that had allowed licensed private certifiers. Certification authority returned to the Chief Rabbinate Council and authorized local rabbis, and the Rabbinate regained its monopoly over imported products. State-recognized conversion remains within the Orthodox Rabbinate system. Israel's Competition Authority opposed the kashrut bill.
  case_for: Shas leader Aryeh Deri ('Kashrut is not a business. Kashrut is a state responsibility'), United Torah Judaism and Religious Zionist MK Ohad Tal argue that a single national standard prevents conflicts of interest and protects consumers. They also say Orthodox-only conversion keeps Jewish status uniform for all Israelis.
  case_against: The Democrats want to end the Rabbinate's 'monopoly over conversion and kashrut', Together wants competition in kosher certification, and Yisrael Beytenu wants wider conversion options. They argue the monopoly raises food costs, shuts out other streams of Judaism and leaves many immigrants unable to convert.
  sources:
  - https://www.jpost.com/israel-news/politics-and-diplomacy/article-902584
  - https://en.idi.org.il/articles/65010
  - https://www.jpost.com/israel-election-2026/article-912335
  terms: []
il16:
  now: Same-sex couples cannot marry in Israel, and no civil-partnership law exists. Since a 2006 High Court ruling, Israel registers same-sex marriages performed abroad, and some parenting, surrogacy and benefit rights have come through court rulings and regulation (Ynet, Sept 2026). Equality based on sexual orientation is not written into a Basic Law.
  case_for: Together proposes a civil partnership open to all couples, and Lapid promises an equal-rights law within 100 days. The Democrats back civil marriage for all couples, and Eisenkot has pledged equality legislation. They argue that tens of thousands of Israeli couples shouldn't have to marry abroad to be recognized at home.
  case_against: Shas and United Torah Judaism oppose LGBTQ rights measures and any marriage track outside religious law, arguing marriage is defined by Jewish law and the state's Jewish character. Religious Zionist leader Smotrich has said he opposes 'LGBT culture' (2021).
  sources:
  - https://www.ynetnews.com/article/bjvkbbsfmx
  - https://jpost.com/israel-election-2026/article-908711
  - https://www.timesofisrael.com/everything-you-need-to-know-tois-guide-to-the-37-parties-that-israelis-can-finally-choose-from/amp/
  terms: []
il17:
  now: Haredi schools are funded on a sliding scale. 'Exempt' schools, with about 40% of haredi pupils, must teach 55% of core-subject hours for 55% funding, and 'recognized unofficial' schools teach 75% for 75%. A 2020 State Comptroller report found 84% of boys in haredi secondary schools studied no core subjects at all (IDI). A 2025 IDI study found that when the ministry did cut funding to noncompliant schools, the cuts were minimal.
  case_for: Yisrael Beytenu ('compulsory core studies in all publicly funded schools'), Together, Yashar and the Reservists argue that taxpayers shouldn't fund schools that leave graduates without math and English. They link this to low haredi male employment and Israel's long-term economy.
  case_against: United Torah Judaism opposes adding secular subjects such as English and math to haredi schools, and Degel HaTorah's Moshe Gafni has called lower funding for those schools 'unwarranted discrimination'. Haredi parties argue that communities have the right to set their own religious curricula.
  sources:
  - https://en.idi.org.il/articles/49956
  - https://www.timesofisrael.com/netanyahu-deal-would-undercut-prime-impetus-for-haredim-to-teach-core-studies/
  - https://www.timesofisrael.com/state-turns-blind-eye-as-haredi-schools-sidestep-core-curriculum-study-reveals/
  terms: []
il18:
  now: On March 27, 2025 the Knesset passed a law, effective with the next Knesset, that reshapes the nine-member Judicial Selection Committee. It will have two ministers, two MKs (coalition and opposition), three justices and two jurists picked by the coalition and the opposition, and no Israel Bar representatives. Globes noted that six of the nine seats become political appointees. The opposition boycotted the vote, and whoever wins on October 27 decides whether the law takes effect or is repealed.
  case_for: 'Likud''s Justice Minister Yariv Levin, the Religious Zionist Party (Smotrich: ''The election is about the judicial system'') and Otzma Yehudit argue that judges choosing their own colleagues produced an unrepresentative court. They want elected officials to have a decisive say.'
  case_against: Together, Yashar and the Democrats pledge to repeal the law, warning it is 'politicizing the appointment process' and would make judges beholden to ministers. The Joint List wants a balanced mechanism that keeps judges independent.
  sources:
  - https://en.globes.co.il/en/article-knesset-passes-judicial-selection-law-1001506201
  - https://www.ynetnews.com/article/hkcjtk1cme
  - https://www.jpost.com/israel-election-2026/article-911432
  terms: []
il19:
  now: Israel has no written constitution, and the Supreme Court reviews laws against the Basic Laws. In January 2024 it struck down, 8-7, the coalition's 2023 amendment cancelling the 'reasonableness' standard (JPost). There is no rule setting the majority needed to pass or amend Basic Laws, and no override mechanism exists.
  case_for: 'The Democrats, the Joint List, Yashar and Together argue that in a one-chamber parliament controlled by the government, the court is the main check on majority power. Yashar and Together would write the rules for review into a Basic Law: Legislation rather than weaken it.'
  case_against: The Religious Zionist Party would require an expanded bench and a special majority to void laws, plus a 61-vote Knesset override. Otzma Yehudit backs a 61-MK override, Shas wants power returned 'to the people', and United Torah Judaism says the court has accumulated excessive power. The Reservists back an override only with 72 or more MKs.
  sources:
  - https://www.ynetnews.com/article/hkcjtk1cme
  - https://www.jpost.com/israel-election-2026/article-911432
  - https://www.timesofisrael.com/everything-you-need-to-know-tois-guide-to-the-37-parties-that-israelis-can-finally-choose-from/amp/
  terms: []
il20:
  now: The cabinet voted unanimously on August 4, 2025 to fire Attorney General Gali Baharav-Miara, bypassing the standard professional-committee process. The High Court struck down the dismissal on December 14, 2025, and she remains in office. A bill to split the role into three government-appointed posts and make the adviser's opinions non-binding passed a preliminary reading on October 29, 2025.
  case_for: Likud's Yariv Levin (who calls the institution 'corrupt to the core'), the Religious Zionist Party and Otzma Yehudit argue that an elected government must be able to work with a legal adviser it trusts. They say binding, unelected legal opinions block policy voters chose.
  case_against: The Democrats ('full backing' for the attorney general) and the AG's office warn the split would be 'a fundamental regime change'. They argue the government would gain control over prosecutions, including those touching ministers and the prime minister's own trial.
  sources:
  - https://www.timesofisrael.com/liveblog_entry/justice-minister-urges-government-to-ignore-court-annulment-of-attorney-generals-sacking/
  - https://www.timesofisrael.com/ag-slams-bill-carving-up-her-role-as-a-threat-to-rule-of-law-democratic-safeguards/
