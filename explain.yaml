  now: New York's 2019 law ended cash bail for most misdemeanors and nonviolent felonies starting in 2020. It has since been amended several times, including in 2022 and in the 2023 budget, which gave judges more discretion to hold people charged with serious crimes. Gov. Hochul's office says the state has not eliminated cash bail and that rearrests of people on pretrial release fell from 24% in 2020 to 17% in 2024. Republican nominee Bruce Blakeman opposes cashless bail and has made crime a central campaign issue.
  case_for: Blakeman, Rep. Elise Stefanik and police unions argue that releasing people before trial without bail lets repeat offenders return to the street and has hurt public safety. They want judges to have broad power to set bail or detain based on how dangerous a defendant is.
  case_against: Public defenders such as the Bronx Defenders and reform advocates argue cash bail jails people for being poor, not for being dangerous, and that judges already have discretion in serious cases. Hochul says the changes already made are working and points to falling rearrest rates.
  terms:
