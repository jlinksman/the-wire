il21:
  now: Netanyahu has been on trial since 2020 for bribery, fraud and breach of trust, which he denies, and he had testified 80 times by April 2026. Current law bars indicted ministers but not an indicted prime minister. Netanyahu has requested a pardon; on April 26, 2026 President Herzog said he would not consider it for now and would seek mediation, including plea talks (ToI).
  case_for: 'Yisrael Beytenu (Liberman''s ''defendant law''), the Democrats (Golan: ''Anyone under criminal indictment cannot serve as prime minister'') and Yashar''s Yoram Cohen argue that a leader on trial faces conflicts of interest. They point to decisions on judges, prosecutors and the attorney general.'
  case_against: Likud, which is running Netanyahu for prime minister, calls the charges a 'witch hunt' and says voters, not prosecutors, should decide who governs. The Religious Zionist Party and Otzma Yehudit also back him. Critics of the bill add that a law aimed at one person could itself be struck down.
  sources:
  - https://www.timesofisrael.com/netanyahu-testimony-set-to-resume-after-monthslong-break-canceled-at-last-minute/
  - https://www.timesofisrael.com/bennett-liberman-lay-out-plans-to-pass-laws-against-netanyahu-immediately-after-election/
