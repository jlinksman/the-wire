  now: Republican nominee Bruce Blakeman proposes what he calls the largest income tax cut in state history, under which a joint filer earning $100,000 would pay no state income tax. He says he would pay for it by restructuring spending, including money now spent assisting immigrants and refugees. Gov. Hochul points to middle-class rate cuts and rebates and says she has not raised income taxes. In February 2026 the Comptroller reported projected budget gaps of $6 billion in FY2028 rising to $12.5 billion in FY2030, along with an estimated $9.4 billion drop in federal support.
  case_for: Blakeman argues the state overspends and that New Yorkers, especially middle-income families, are leaving because taxes are too high, so leaner programs are a fair price for letting people keep more of their pay. Supporters say lower taxes would make the state more competitive and help keep residents and businesses.
  case_against: Hochul and her allies argue the state can deliver targeted relief without cutting the programs families rely on. They point to large projected budget gaps and falling federal aid as reasons a big tax cut would force deep cuts to areas such as schools and health care.
