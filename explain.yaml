  now: In June 2025 Gov. Hochul directed the New York Power Authority to build at least 1 gigawatt of new advanced nuclear power upstate, and in January 2026 she raised the goal to 5 gigawatts. NYPA's 2025 solicitations drew interest from eight upstate communities and 23 companies, and in June 2026 it opened formal windows for developers able to start construction before 2033. As of March 2026 no site, partner or reactor design had been chosen.
  case_for: Hochul, NYPA, the nuclear industry and host communities such as Oswego and Schuyler counties argue nuclear provides steady, zero-emission power around the clock as demand grows. Supporters say it would anchor good jobs and back up wind and solar to meet climate goals.
  case_against: Climate groups such as NY Renews and Cornell scientist Robert Howarth argue nuclear is far costlier and slower to build than solar, wind or storage. They also cite unresolved waste storage and the history of projects like Shoreham that never opened.
