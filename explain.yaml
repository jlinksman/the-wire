  now: In January 2025 the Department of Homeland Security rescinded its long-standing guidance limiting arrests at schools, hospitals and houses of worship, leaving it to officers' discretion; federal courts have since blocked enforcement only at specific plaintiffs' churches. New York's FY2027 budget, signed May 29, 2026, includes the New York for All Act. It requires a judicial warrant for ICE to enter public places such as schools and hospitals, and lets private sites like houses of worship require one. On Aug. 3, 2026, a federal judge blocked the state's ICE mask ban but let the limits on cooperation with ICE take effect.
  case_for: Gov. Hochul, immigrant-rights coalitions and groups such as the Legal Aid Society argue that arrests at schools, clinics and churches keep families from seeking care, education and worship. Faith groups that sued DHS say a warrant rule protects religious freedom and community safety.
  case_against: The Trump administration argues bright-line limits are unnecessary and that officers should use judgment, since immigration enforcement is a federal power. Republicans who back the administration say warrant rules shield people in the country illegally and that the Justice Department is right to challenge state limits in court.
  terms:
  - ICE
  - sensitive locations
  - judicial warrant
  - New York for All
  - immigration enforcement
