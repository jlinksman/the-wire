il23:
  now: The state subsidizes daycare for children up to age 3 in supervised centers when both parents work or study, at about NIS 1.2 billion a year (IDI, 2024). Under the High Court's April 2026 ruling, the subsidy no longer goes to families of draft evaders. A 2022 Netanyahu pledge of free childcare for under-3s 'had not been delivered' (JPost, Oct 2026).
  case_for: The Joint List calls for 'free education from age 0 through university' and more welfare spending, and the Democrats want money shifted from sectoral budgets to social services. They argue affordable childcare raises parents' employment and that public investment eases the cost of living.
  case_against: The Reservists-Economic Party wants VAT cut to 12% and the top income-tax rate capped at 40%, and Likud emphasizes 'lower taxes'. They argue that Israel's high tax burden is itself a main driver of the cost of living, so new spending would add to the problem.
  sources:
  - https://en.idi.org.il/articles/56417
  - https://www.jpost.com/israel-election-2026/article-911432
  - https://jpost.com/israel-news/article-911893
  terms: []
il24:
  now: A household basket costs about 21% more in Israel than in Europe's wealthiest countries, and food is over 27% pricier (Aaron Institute, April 2026). Israel's three largest supermarket chains hold over half the market (ToI). Tariffs, import limits, dairy quotas, VAT and kashrut rules explain much of the gap. A planned dairy reform has not passed.
  case_for: Together would break up monopolies and force Shufersal to sell stores, and the Reservists' Yaron Zelekha says Netanyahu 'sold the economy to monopolies' and would ban exclusive import deals and set up a new bank. The Joint List backs far deeper state intervention. They argue a few conglomerates and banks set prices with little competition.
  case_against: Yisrael Beytenu calls for 'reductions in regulation and government bureaucracy', and Smotrich's Religious Zionist Party favors 'increasing free market competition'. They argue high prices stem mainly from tariffs, quotas and red tape. Removing those barriers lets imports and new entrants compete without heavier rules on firms.
  sources:
  - https://en.globes.co.il/en/article-1001541377
  - https://www.timesofisrael.com/food-and-beverage-prices-in-israel-52-higher-than-oecd-average-report/
  - https://www.jpost.com/israel-election-2026/article-910703
  terms: []
il25:
  now: Israel has no civil marriage for Jews, so the Chief Rabbinate and rabbinical courts, which rule by halacha (Jewish law), already control Jewish marriage, divorce and conversion. On March 24, 2026 the Knesset voted 65-41 for the Religious Courts Arbitration Law, letting rabbinical (and Sharia) courts arbitrate civil disputes such as employment or neighbor cases when both sides consent; criminal cases, cases involving the state and most marital cases are excluded. The coalition also advanced a Basic Law making Torah study a protected value.
  case_for: Shas, United Torah Judaism and Religious Zionism argue that Jewish law is a moral legal tradition thousands of years old, and that a Jewish state should give it more room. UTJ's Moshe Gafni asked what is wrong with two people choosing to settle money disputes by Torah law. Smotrich and Rothman call voluntary rabbinical arbitration liberal, and Otzma Yehudit wants Jewish law built into the court system.
  case_against: Yair Lapid and Naftali Bennett of Beyachad, Avigdor Liberman of Yisrael Beytenu and the Democrats' Yair Golan say this pushes Israel toward a 'halachic state' run by religious coercion. Women's groups and Yesh Atid MK Meirav Cohen warn that rabbinical courts are not equal for women and that 'consent' can be pressured. Bennett has promised to repeal the arbitration law.
  sources:
  - https://www.jpost.com/israel-news/article-891046
  - https://jpost.com/israel-news/article-887001
  - https://en.idi.org.il/israeli-elections-and-parties/parties/otzma-yehudit
  terms: []
il26:
  now: Shabbat opening rules are set mostly by city bylaws, so most shops in Jewish cities close from Friday evening to Saturday night while some cities, such as Tel Aviv, let groceries open. A 2018 'mini-markets' law, passed 58-57, lets the interior minister cancel new bylaws that allow Shabbat trading but leaves older bylaws in place, and gas-station stores may stay open. Shas leader Aryeh Deri drove that law as interior minister.
  case_for: Shas and United Torah Judaism, with Likud supplying the votes for the 2018 law, say a shared day of rest is part of Israel's Jewish character, and UTJ also opposes infrastructure work on Shabbat. Deri argues that once supermarkets open, every other kind of store follows and 'there will be no Shabbat left.' He also says weaker workers would end up forced to work seven days a week.
  case_against: Yisrael Beytenu wants cities to decide for themselves which businesses may open, and its MKs voted against the 2018 law. The Democrats' Yair Golan says 'a business that wants to open on Shabbat ... will open. Whoever wants to observe Shabbat, will observe it.' Critics, including Meretz in its court challenge to the 2018 law, say it lets a religious minister impose his lifestyle on secular towns.
  sources:
  - https://jta.org/?p=1503673
  - https://www.jpost.com/israel-election-2026/article-910100
  - https://www.ynetnews.com/articles/0,7340,L-5058047,00.html
  terms: []
il27:
  now: Paying for the war pushed the deficit to 8.1% of GDP, and VAT rose from 17% to 18% on January 1, 2025. The 2026 budget aimed for a 3.6% deficit, with the Defense Ministry asking for NIS 144 billion. Finance Minister Smotrich paired wider income-tax brackets and a new tax on banks with demands that other ministries cut spending.
  case_for: Likud's platform stresses lower taxes and limited government, and Smotrich has told voters they 'will pay less income tax.' The Reservists-Economic Party's Yaron Zelekha would lower VAT to 12% and the top income-tax rate to 40%, paid for by freezing budgetary pensions and ending coalition discretionary funds. Supporters say the state is bloated and families carry too much tax.
  case_against: The Democrats want a larger state role, with more childcare, public housing and stronger unions, and the Joint List wants free education from birth through university plus state housing. Shas puts welfare and food aid for poor families first. Opponents say huge defense costs and weak public services leave no room to cut spending, and tax cuts would mostly help higher earners.
  sources:
  - https://www.jns.org/israel-raises-vat-to-18-as-part-of-effort-to-rein-in-deficit/
  - https://en.globes.co.il/en/article-1001528382
  - https://www.israelnationalnews.com/news/434699
  terms: []
il28:
  now: Israel sold Israel Military Industries to Elbit in 2018, but the state still owns large firms such as Israel Aerospace Industries (worth about $20 billion) and Rafael (about $10 billion). In January 2026 the Government Companies Authority said it planned to start selling 25-30% stakes in both on the Tel Aviv exchange, and a ministerial panel had approved selling up to 49% of IAI. It also said Ashdod port could be privatized next.
  case_for: Officials in the Likud-led government say selling stakes raises billions and frees state companies from bureaucracy, citing IMI's value rising fourfold under Elbit. Zehut, now running with Religious Zionism, wants a smaller, freer market. The Reservists-Economic Party wants private firms to build and run new airports, rail lines and hospitals.
  case_against: The Joint List would nationalize previously privatized companies and services, and the Democrats favor a larger state role and stronger unions. Union interests at IAI, Rafael and the ports remain a hurdle. Critics also warn that selling defense makers raises questions about state secrets and could give private owners pricing power over vital services.
  sources:
  - https://www.algemeiner.com/2026/01/12/israel-poised-launch-defense-privatizations-months-says-government-official/
  - https://breakingdefense.com/2026/07/israels-two-giant-state-run-defense-companies-may-go-public-but-there-are-hurdles/
  - https://jns.org/feature/israels-political-parties-explained-raam-and-the-joint-list
  terms: []
il29:
  now: Israel's minimum wage rose 3.3% in April 2026 to NIS 6,443 a month for a full-time job. By law it is updated each April to at least 47.5% of the average wage, and the Histadrut labor federation fought off a planned freeze in the 2025 budget. A 2021 deal under then-Finance Minister Liberman had set it on a path to NIS 6,000 by 2026.
  case_for: The Joint List would raise the minimum wage to at least 70% of the average wage, close to double today's level. It says this is needed because Israel's cost of living is among the highest in the developed world. The Histadrut argues that the lowest earners need protection most during a crisis, and that a higher floor cuts poverty among working families.
  case_against: Most Jewish parties, including Likud, Beyachad, Yisrael Beytenu and the Reservists-Economic Party, focus instead on lowering prices through competition and lower taxes rather than a big wage jump. Critics of sharp increases argue they raise labor costs for small firms and could cost low-wage jobs. The Finance Ministry sought a freeze in the 2025 budget before the Histadrut blocked it.
  sources:
  - https://www.ynetnews.com/article/itazxxsjz
  - https://global.histadrut.org.il/news/israels-minimum-wage-to-rise-by-3-3/
