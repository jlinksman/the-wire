  now: Sen. Rob Rolison's bill S980 (Assembly companion A2004) would require a public hearing in the affected region at least 90 days before the PSC decides any utility rate increase, with residents able to question the commission and the utility. It cleared the Senate Energy Committee in May 2025 but was sent back to committee on Jan. 7, 2026 and has not passed either house. Central Hudson's current rate plan was approved on Aug. 14, 2025, and Rep. Josh Riley asked the PSC to reconsider it, calling the process broken.
  case_for: Rolison and Assembly Republicans Matt Slater and Anil Beephan argue that people paying the bill deserve to question regulators and the utility face to face, close to home, before a decision is final. Rep. Riley's challenge to the 2025 Central Hudson decision reflects a broader view that the current process does not give ratepayers enough of a voice.
  case_against: Opponents of a fixed mandate say rate cases already run through a long formal process with intervenors, written comments and evidentiary hearings, and a rigid hearing requirement could add delay and cost. Some senators on the Energy Committee voted no or 'with reservations' on S980, and the bill has stalled in committee.
