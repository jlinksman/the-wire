# Weekend issue spotters (2026-11-04): fictional facts; claims and decoys are card ids, all must be live.
issues:
  - id: issue_oil_well
    facts: In October 2019 a driver for Emberline Fuel, a Wappingers Falls heating-oil dealer, overfilled the basement tank at a rental house on Myers Corners Road, and the vent pipe sprayed oil onto the
      side yard. Nobody reported it. In August 2024 the next-door owner, Lena Vasquez, noticed a fuel smell in her well water; a lab confirmed petroleum and a consultant traced it to the 2019 overfill. Her
      well needs a treatment system and her house is hard to sell. She sues Emberline in May 2026 for her cleanup costs and lost value, and Emberline answers that her claim is time-barred because the spill
      happened more than three years before she sued.
    claims:
    - card: nav181
      why: A petroleum discharge by the company that caused it, with cleanup costs and damages to a neighbor.
    - card: cplr214c
      why: Injury to property from the latent effects of exposure to a substance; the three years run from her 2024 discovery, not the 2019 spill, so the 2026 suit is timely.
    - card: negligence
      why: The driver's overfill breached a duty of care to neighbors and caused the contamination.
    decoys:
    - card: cercla107
      why_not: Petroleum is excluded from CERCLA's hazardous substances, so § 107 does not reach a heating-oil spill.
    - card: cwa301
      why_not: Oil sprayed onto a yard and seeping into a private well is not a point-source discharge to navigable waters.
    status: verified
    verified: '2026-11-04'

  - id: issue_cider_handshake
    facts: 'In 2023 Bramblecrest Cider of Cold Spring and Larkfield Distributing of Newburgh shook hands on a deal: Larkfield would be Bramblecrest''s exclusive distributor in Orange and Dutchess for as long
      as it hit its sales targets, and Bramblecrest could end it only if Larkfield fell short. Nothing was signed. In 2025 Bramblecrest''s owner, Tom Aldana, switched distributors and told three Beacon bar
      owners that Larkfield "has been skimming cash from your accounts," which was untrue. Larkfield sued for breach and for slander. Before answering, Bramblecrest moved to dismiss the contract claim as
      barred by the statute of frauds.'
    claims:
    - card: gol5701_1yr
      why: An oral exclusive deal that could end within a year only through Larkfield's breach is within the one-year provision and void unless written.
    - card: cplr3211a
      why: Bramblecrest moves before answering under 3211(a)(5), which lists the statute of frauds.
    - card: slander_per_se
      why: A spoken, false accusation that Larkfield steals from its customers charges a serious crime and injures it in its business, so damages are presumed.
    decoys:
    - card: gol5_1401
      why_not: There is no written contract, let alone a choice of New York law, and the deal is between two New York businesses.
    - card: cplr213_8
      why_not: Larkfield sues for breach and slander, not fraud.
    status: verified
    verified: '2026-11-04'

  - id: issue_inn_septic
    facts: The Wildacre Inn in Rhinebeck hired Kessel & Lowe, a firm of licensed professional engineers, under a written contract to design a new septic field. The system was finished in June 2021 and failed
      in 2022, flooding the lawn behind the inn. The inn sued in September 2025, pleading only breach of contract and arguing it had six years. After the note of issue was filed in January 2026, Kessel &
      Lowe moved for summary judgment on limitations in July 2026, 170 days later, with no explanation for the timing. The court had not set its own deadline.
    claims:
    - card: cplr214
      why: A claim for engineering malpractice takes three years under 214(6) even when it is pleaded only as breach of contract.
    - card: cplr3212a
      why: The motion came after 120 days with no court-set date and no excuse, so under Brill it should be denied as untimely despite its merit.
    decoys:
    - card: cplr213
      why_not: The six-year contract period gives way to 214(6) for non-medical professional malpractice.
    - card: cplr214c
      why_not: The harm is a failed design, not the latent effect of exposure to a substance.
    status: verified
    verified: '2026-11-04'

  - id: issue_solar_forum
    facts: Cobblefield Solar, a Delaware LLC based in Kingston, signed a $3.2 million contract with Ohio-based Tallgrass Racking for panel mounts for an Ulster County array. The contract says New York law
      governs and that Tallgrass "submits to the jurisdiction of the courts of the State of New York." Tallgrass shipped late, and Cobblefield sued in Supreme Court, Ulster County. Tallgrass moved to dismiss
      before answering, arguing that New York courts have no personal jurisdiction over it and that Ohio law should apply because the contract has no real New York connection.
    claims:
    - card: gol5_1401
      why: The transaction is over $250,000 and chooses New York law, so the choice holds whether or not the contract bears a reasonable relation to New York, which answers Tallgrass's Ohio-law argument.
    - card: gol5_1402
      why: Over $1 million, NY law chosen, and the Ohio company agreed to submit to NY courts, so Cobblefield may sue it here.
    - card: cplr3211a
      why: Tallgrass's pre-answer motion rests on lack of personal jurisdiction under 3211(a)(8).
    decoys:
    - card: gol5701
      why_not: The contract is written and signed, so the statute of frauds is no obstacle.
    - card: cplr1411
      why_not: This is a contract claim, not an action for personal injury, property damage or wrongful death.
    status: verified
    verified: '2026-11-04'

  - id: issue_daycare_vapor
    facts: From 1988 to 2012 Starchwell Cleaners ran a dry-cleaning shop in a Poughkeepsie strip mall and dumped spent perchloroethylene (PCE) down a floor drain. In 2025 state testing found PCE vapor in
      the basement of Wrenwood Daycare next door, which closed for a month and installed a venting system. The state spent $400,000 on an investigation and sub-slab system and seeks to recover it from Gus
      Halloran, who owned Starchwell and ran the shop and its floor drain himself. Wrenwood, which first learned of the vapor from the 2025 tests, sues Halloran in 2026 for the lost month and the system's
      cost.
    claims:
    - card: cercla_prp
      why: Halloran personally ran the shop when the PCE was disposed of, so he is an operator at the time of disposal, a responsible-party class.
    - card: cercla107
      why: A release of a hazardous substance (PCE) from a facility caused the state to incur response costs.
    - card: cplr214c
      why: Wrenwood's property injury came from latent exposure to a substance and it sued within three years of discovering it in 2025.
    - card: private_nuisance
      why: The vapor substantially and unreasonably interfered with the daycare's use of its premises.
    decoys:
    - card: nav181
      why_not: PCE is a chlorinated solvent, not petroleum.
    - card: cwa301
      why_not: Vapor in a basement and a floor drain to soil are not a point-source discharge to navigable waters.
    status: verified
    verified: '2026-11-04'

  - id: issue_trench_fall
    facts: A crew from Thistledown Landscaping left a two-foot trench open and unmarked across a Main Street sidewalk in Beacon overnight. Pedestrian Marisol Chen, reading her phone, stepped into it and broke
      her ankle. Thistledown had a city permit for the work but put out no cones, tape or plates, though its foreman admitted the crew usually did. She sued Thistledown for negligence. After discovery, Thistledown
      moved for summary judgment, supported only by its lawyer's affirmation that the trench was "plainly visible." At trial the jury found Thistledown 70% at fault and Chen 30% at fault for not watching
      where she walked, and assessed her damages at $180,000.
    claims:
    - card: negligence
      why: Thistledown owed pedestrians a duty to guard the trench, breached it, and caused her injury.
    - card: cplr3212
      why: A lawyer's affirmation without personal knowledge is no prima facie showing (Zuckerman), so the motion fails whatever the opposition says (Alvarez).
    - card: cplr1411
      why: Her 30% share reduces her damages but does not bar recovery in a non-motor-vehicle injury case.
    decoys:
    - card: abnormally_dangerous
      why_not: Digging a landscaping trench is a common activity whose risk reasonable care (a barrier) removes.
    - card: cplr214c
      why_not: A fall is an immediate traumatic injury, not the latent effect of exposure to a substance.
    status: verified
    verified: '2026-11-04'
