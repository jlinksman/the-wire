# legal.yaml — legal refresher cards for the Puzzle Page (GAMES.md §4). Public law only.
#
# Rules (approved 2026-10-27):
# - Elements are stated in our own words from primary authority (statute text, controlling cases)
#   and cited. Never PJI, Restatement or bar-prep text. Refreshers, not advice.
# - Every card is labeled NY / federal, carries a "verified" date, and is second-checked against
#   the cited sources before it ships (status: verified). Draft cards never reach the page.
# - One element per review item: each element gets its own schedule.
# - News tie-in: `news` is a regex on story titles; a matching story features the card, unless
#   `news_not` matches its title or summary (a story under a neighbouring statute: a CWA § 311
#   response-plan rule is not § 301 or CERCLA; a household hazardous-waste drop-off is not RCRA § 7002).
# - Syllabus order: environmental, then torts. Later areas wait for a month of use.
#
# Second check 2026-10-27 (independent reviewer, against statute text on nysenate.gov and Cornell
# LII, and star-paged case copies from the Caselaw Access Project): corrections applied below.
# Still draft: trespass (elements 2–3 need their own NY authority) and CPLR 1411 (amended
# 2026-05-29; confirm the amending chapter's effective date and scope first).
#
# Card fields: id, area, family (elements / list / factors / rule: the Friday quiz's odd-one-out only
# mixes elements from cards of the same area and family), title, jurisdiction, cite, source (URL), verified, status, news,
# note (variants to remember), elements [{text, keys}], optional cloze {text, answer, accept, source},
# openleg (NY sections to watch; otherwise the source URL's section). A watched section that changes
# after `verified`, or a cloze that no longer matches the statute, holds the card (pipeline/openleg.py).

cards:
  # ------------------------------------------------------------ NY spill and environmental
  - id: nav181
    area: environmental
    family: elements
    title: "Navigation Law § 181 — strict liability for a petroleum discharge"
    jurisdiction: NY
    cite: "N.Y. Navigation Law §§ 172(8), 181(1), (5); State of New York v. Green, 96 N.Y.2d 403, 405, 407 (2001)"
    source: https://www.nysenate.gov/legislation/laws/NAV/181
    openleg: [NAV/181, NAV/172]   # sections watched for amendments (Open Legislation)
    status: verified
    verified: "2026-10-27"
    news: '\b(oil|petroleum|gasoline|fuel|heating oil|diesel|kerosene) (spills?|leaks?|discharges?)\b|\bnavigation law\b'
    news_not: '\b(clean water act|section 311|response plans?)\b'
    news_ny: true          # a NY statute: only New York stories feature it
    note: "Liability is strict, without regard to fault. A discharge includes any intentional or unintentional act or omission (§ 172(8)). Under State v. Green, a landowner who can control activities on its property and has reason to believe petroleum will be stored there is a discharger; mere ownership is not enough."
    elements:
      - text: "A discharge of petroleum"
        keys: [discharge, petroleum, spill, release]
      - text: "The defendant is a discharger"
        keys: [discharger, caused, control]
      - text: "Cleanup and removal costs, or direct or indirect damages"
        keys: [cleanup, removal, costs, damages]
    cloze:
      text: "Any person who has discharged petroleum shall be strictly liable, ___, for all cleanup and removal costs and all direct and indirect damages, no matter by whom sustained, as defined in this section."
      answer: "without regard to fault"
      accept: ["without regard to fault", "regardless of fault"]
      source: https://www.nysenate.gov/legislation/laws/NAV/181
    missing:
    - facts: A Brightwater Fuel driver overfilled a home heating-oil tank, spilling a cup of oil on the owner's driveway. Brightwater wiped it up the same hour; the neighbor, Rhea Dunn, then sued Brightwater
        under § 181 though she spent nothing and suffered no harm.
      missing: 2
      why: Dunn has no cleanup or removal costs and no direct or indirect damages.
    - facts: Corliss Holdings bought a vacant lot already contaminated by petroleum from a long-gone prior owner; it never stored petroleum there and had no reason to expect anyone would. The State cleaned
        the lot and sued Corliss.
      missing: 1
      why: Mere ownership of contaminated land, without control over petroleum activity it had reason to expect, does not make Corliss a discharger (State v. Green).
    cases:
    - name: State of New York v. Green
      cite: 96 N.Y.2d 403, 405 (2001)
      url: https://static.case.law/ny-2d/96/html/0403-01.html
      holding: A faultless landowner is a discharger when it can control activities on its property and has reason to believe petroleum will be stored there, though ownership of contaminated land alone is not
        enough.
      element: 1

  - id: cercla107
    area: environmental
    family: elements
    title: "CERCLA § 107(a) cost recovery — prima facie case"
    jurisdiction: federal
    cite: "42 U.S.C. § 9607(a); B.F. Goodrich Co. v. Murtha, 958 F.2d 1192, 1198 (2d Cir. 1992)"
    source: https://www.law.cornell.edu/uscode/text/42/9607
    status: verified
    verified: "2026-10-27"
    news: '\b(cercla|superfund|cost recovery|potentially responsible part(y|ies))\b'
    news_not: '\b(clean water act|section 311|response plans?|rcra)\b'
    note: "For a government plaintiff the costs need only be \"not inconsistent with\" the NCP, which puts the burden on the defendant (§ 9607(a)(4)(A) vs (B))."
    elements:
      - text: "The defendant is within one of the four classes of responsible parties"
        keys: [responsible party, prp, owner, operator, arranger, transporter, classes]
      - text: "The site is a facility"
        keys: [facility, site]
      - text: "A release or threatened release of a hazardous substance"
        keys: [release, hazardous]
      - text: "The release caused the plaintiff to incur response costs"
        keys: [response costs, costs, incur]
      - text: "The costs are consistent with the National Contingency Plan"
        keys: [national contingency plan, ncp, contingency]
    numbers:
    - q: Deadline for an initial CERCLA cost-recovery action for a removal action, measured from completion of the removal (absent a § 104(c)(1)(C) waiver), § 113(g)(2)(A)
      answer: 3
      unit: years
      cite: 42 U.S.C. § 9613(g)(2)(A)
    - q: Deadline for an initial CERCLA cost-recovery action for a remedial action, measured from initiation of physical on-site construction, § 113(g)(2)(B)
      answer: 6
      unit: years
      cite: 42 U.S.C. § 9613(g)(2)(B)
    - q: Deadline for a CERCLA contribution action after the judgment or qualifying settlement, § 113(g)(3)
      answer: 3
      unit: years
      cite: 42 U.S.C. § 9613(g)(3)
    missing:
    - facts: Halvard Tool, a private company, dug out drums of solvent that a former operator had buried at its plant and sued that operator to recover the cost. Halvard did the job with no sampling plan, no
        public comment and no regard to the National Contingency Plan.
      missing: 4
      why: A private plaintiff must show its response costs were consistent with the NCP.
    - facts: A neighbor found trichloroethylene seeping from the Ostend Plating site, a facility owned by Ostend since the 1990s. The neighbor sued Ostend under § 107(a) before spending anything on investigation
        or cleanup.
      missing: 3
      why: No response costs have been incurred yet.
    cases:
    - name: State of New York v. Shore Realty Corp.
      cite: 759 F.2d 1032, 1044 (2d Cir. 1985)
      url: https://static.case.law/f2d/759/html/1032-01.html
      holding: The current owner of a facility with a release or threatened release is strictly liable under § 107(a)(1) without any showing that it caused the release.
      element: 0
    - name: B.F. Goodrich Co. v. Murtha
      cite: 958 F.2d 1192, 1198 (2d Cir. 1992)
      url: https://static.case.law/f2d/958/html/1192-01.html
      holding: CERCLA liability is strict, so a plaintiff that proves the statutory elements need not show fault.
      element: null

  - id: cercla_prp
    area: environmental
    family: list
    title: "CERCLA § 107(a) — the four classes of responsible parties"
    jurisdiction: federal
    cite: "42 U.S.C. § 9607(a)(1)–(4)"
    source: https://www.law.cornell.edu/uscode/text/42/9607
    status: verified
    verified: "2026-10-27"
    news: '\b(cercla|superfund|potentially responsible part(y|ies)|PRPs?)\b'
    news_not: '\b(clean water act|section 311|response plans?)\b'
    elements:
      - text: "The current owner or operator of the facility (or vessel)"
        keys: [current owner, current operator, current]
      - text: "The owner or operator at the time of disposal"
        keys: [time of disposal, past owner, former owner, prior owner]
      - text: "Arrangers: those who arranged for disposal or treatment of hazardous substances they owned or possessed"
        keys: [arrange, arranger, generator]
      - text: "Transporters: those who accepted hazardous substances for transport to disposal or treatment sites they selected"
        keys: [transport, transporter, selected]
    cases:
    - name: United States v. Bestfoods
      cite: 524 U.S. 51, 66–67 (1998)
      url: https://static.case.law/us/524/html/0051-01.html
      holding: An operator is one who manages, directs or conducts operations specifically related to pollution, such as the leakage or disposal of hazardous waste or decisions about environmental compliance.
      element: 1
    - name: Burlington Northern & Santa Fe Ry. Co. v. United States
      cite: 556 U.S. 599, 611–13 (2009)
      url: https://static.case.law/us/556/html/0599-01.html
      holding: A seller of a useful product is an arranger only if it sold intending that at least part of the product be disposed of; knowing some would spill was not enough.
      element: 2

  - id: cercla107b
    area: environmental
    family: list
    title: "CERCLA § 107(b) — the statutory defenses"
    jurisdiction: federal
    cite: "42 U.S.C. § 9607(b)"
    source: https://www.law.cornell.edu/uscode/text/42/9607
    status: verified
    verified: "2026-10-27"
    news: '\b(cercla|superfund)\b'
    note: "The defendant proves by a preponderance that the release and resulting damages were caused solely by one of these. Innocent landowner, bona fide prospective purchaser and contiguous owner protections sit elsewhere (§§ 9601(35), 9607(q), (r))."
    elements:
      - text: "An act of God"
        keys: [act of god, god]
      - text: "An act of war"
        keys: [act of war, war]
      - text: "An act or omission of a third party other than an employee or agent, or one in a direct or indirect contractual relationship with the defendant (common-carrier tariff excepted), where the defendant exercised due care and took precautions against foreseeable acts or omissions"
        keys: [third party, unrelated]
      - text: "Any combination of the above"
        keys: [combination]
    cases:
    - name: State of New York v. Lashins Arcade Co.
      cite: 91 F.3d 353, 359–62 (2d Cir. 1996)
      url: https://static.case.law/f3d/91/html/0353-01.html
      holding: A shopping-center owner that bought after unrelated dry-cleaner tenants caused the contamination, and took reasonable steps once it owned the site, met the third-party defense's due-care and
        precaution requirements; due care did not require a pre-purchase investigation or paying for the State's study.
      element: 2

  - id: rcra7002
    area: environmental
    family: elements
    title: "RCRA § 7002(a)(1)(B) — imminent and substantial endangerment citizen suit"
    jurisdiction: federal
    cite: "42 U.S.C. § 6972(a)(1)(B); Cordiano v. Metacon Gun Club, Inc., 575 F.3d 199, 210–11 (2d Cir. 2009)"
    source: https://www.law.cornell.edu/uscode/text/42/6972
    status: verified
    verified: "2026-10-27"
    news: '\b(rcra|resource conservation and recovery act|imminent and substantial endangerment)\b'
    news_not: '\b(household hazardous waste|collection (event|day)|drop-off)\b'
    note: "\"Substantial\" means serious (Cordiano). Ninety days' notice before suit, § 6972(b)(2)(A)."
    elements:
      - text: "The defendant is a person (including a past or present generator, transporter, or owner or operator of a treatment, storage or disposal facility)"
        keys: [person, generator, transporter, owner, operator]
      - text: "Who has contributed or is contributing to the past or present handling, storage, treatment, transportation or disposal of solid or hazardous waste"
        keys: [contributed, contributing, handling, disposal, waste]
      - text: "Which may present an imminent and substantial endangerment to health or the environment"
        keys: [imminent, substantial, endangerment]
    numbers:
    - q: Notice required before filing an imminent-and-substantial-endangerment suit under § 7002(a)(1)(B), § 7002(b)(2)(A)
      answer: 90
      unit: days
      cite: 42 U.S.C. § 6972(b)(2)(A)
    - q: Notice required before filing a permit- or standard-violation suit under § 7002(a)(1)(A) (contrast with (a)(1)(B)), § 7002(b)(1)(A)
      answer: 60
      unit: days
      cite: 42 U.S.C. § 6972(b)(1)(A)
    missing:
    - facts: Marrow Auto bought a former gas station, dug out all the contaminated soil under DEC oversight, and the site now tests clean. Marrow then sued the prior owner under RCRA § 7002(a)(1)(B) to recover
        the excavation costs.
      missing: 2
      why: Once cleaned up, the site presents no present imminent and substantial endangerment (and RCRA does not reimburse past cleanup; Meghrig).
    cases:
    - name: Meghrig v. KFC Western, Inc.
      cite: 516 U.S. 479, 485–88 (1996)
      url: https://static.case.law/us/516/html/0479-01.html
      holding: A private party cannot use the RCRA citizen suit to recover past cleanup costs, and may sue only when the waste presents an imminent and substantial endangerment when the suit is filed.
      element: 2

  - id: cwa301
    area: environmental
    family: elements
    title: "Clean Water Act § 301(a) — unpermitted discharge"
    jurisdiction: federal
    cite: "33 U.S.C. §§ 1311(a), 1362(12); Cordiano v. Metacon Gun Club, Inc., 575 F.3d 199, 215 (2d Cir. 2009)"
    source: https://www.law.cornell.edu/uscode/text/33/1311
    status: verified
    verified: "2026-10-27"
    news: '\b(npdes|spdes|discharge permit|unpermitted discharge|illegal discharge|waters of the united states|wotus|clean water act (permit|violation|lawsuit|suit|citizen suit|section 301))\b'
    news_not: '\b(section 311|response plans?|oil spill prevention|hazardous substance facility)\b'
    note: "Sackett v. EPA (2023) narrowed \"navigable waters\"; County of Maui (2020) reaches the functional equivalent of a direct discharge through groundwater."
    elements:
      - text: "A discharge (an addition)"
        keys: [discharge, addition]
      - text: "Of a pollutant"
        keys: [pollutant]
      - text: "To navigable waters"
        keys: [navigable, waters]
      - text: "From a point source"
        keys: [point source]
      - text: "Without a permit (NPDES under § 1342, or § 404 dredge-and-fill under § 1344)"
        keys: [permit, npdes]
    numbers:
    - q: Maximum term of an NPDES permit under an approved state program, CWA § 402(b)(1)(B)
      answer: 5
      unit: years
      cite: 33 U.S.C. § 1342(b)(1)(B)
    - q: Notice required before a CWA citizen suit for violation of an effluent standard or limitation, § 505(b)(1)(A)
      answer: 60
      unit: days
      cite: 33 U.S.C. § 1365(b)(1)(A)
    missing:
    - facts: Pellam Dyeworks pipes rinse water containing dye into the Fishkill Creek through a single outfall. It holds a current SPDES permit and every discharge has stayed within its limits.
      missing: 4
      why: The discharge is permitted and in compliance, so § 301(a) is not violated.
    cases:
    - name: County of Maui v. Hawaii Wildlife Fund
      cite: 590 U.S. 165 (2020)
      url: https://www.supremecourt.gov/opinions/preliminaryprint/590US1PP_web.pdf#page=181
      holding: A permit is needed for a direct discharge from a point source into navigable waters or for the functional equivalent of one, such as pollutants that travel through groundwater and arrive in a
        comparable way.
      element: 3
    - name: Sackett v. EPA
      cite: 598 U.S. 651 (2023)
      url: https://www.supremecourt.gov/opinions/22pdf/598us2r28_hgcj.pdf
      holding: Waters of the United States are relatively permanent bodies like streams, rivers and lakes, and wetlands count only where a continuous surface connection makes them indistinguishable from such
        a water.
      element: 2

  # ------------------------------------------------------------ torts (NY)
  - id: negligence
    area: torts
    family: elements
    title: "Negligence (NY)"
    jurisdiction: NY
    cite: "Pasternack v. Laboratory Corp. of America Holdings, 27 N.Y.3d 817, 825 (2016) (quoting Solomon v. City of New York, 66 N.Y.2d 1026, 1027 (1985))"
    source: https://www.nycourts.gov/reporter/3dseries/2016/2016_05179.htm
    status: verified
    verified: "2026-10-27"
    news: '\bnegligen\w+\b'
    elements:
      - text: "A duty owed by the defendant to the plaintiff"
        keys: [duty]
      - text: "A breach of that duty"
        keys: [breach]
      - text: "Injury proximately resulting from the breach"
        keys: [proximate, cause, causation, injury, damages, harm]
    numbers:
    - q: Limitations period for a personal-injury action in NY, CPLR 214(5)
      answer: 3
      unit: years
      cite: N.Y. CPLR 214(5)
    missing:
    - facts: A Fernwood Market clerk left a mop bucket in a dark aisle. Shopper Ada Lunt saw it, stepped around it, and finished her shopping unhurt, then sued over the hazard.
      missing: 2
      why: No injury resulted, so there is nothing for the breach to have proximately caused.
    - facts: Ines Paley drove her friend home at the speed limit, sober and watching the road. A deer leapt from the brush too close to avoid, and the friend was hurt in the crash.
      missing: 1
      why: Paley owed her passenger a duty of care but did nothing unreasonable, so there was no breach.
    cases:
    - name: Palsgraf v. Long Island R.R. Co.
      cite: 248 N.Y. 339, 343–44 (1928)
      url: https://static.case.law/ny/248/html/0339-01.html
      holding: Duty runs only to those within the range of reasonably foreseeable risk, so a passenger far down the platform could not recover for guards' conduct that endangered only the man they were helping.
      element: 0
    - name: Derdiarian v. Felix Contracting Corp.
      cite: 51 N.Y.2d 308, 315 (1980)
      url: https://static.case.law/ny-2d/51/html/0308-01.html
      holding: A third party's intervening act does not break the causal chain if it is a normal or foreseeable consequence of the situation the defendant's negligence created; only an extraordinary or remote
        act does.
      element: 2

  - id: private_nuisance
    area: torts
    family: elements
    title: "Private nuisance (NY)"
    jurisdiction: NY
    cite: "Copart Industries, Inc. v. Consolidated Edison Co. of N.Y., 41 N.Y.2d 564, 569–70 (1977)"
    source: https://static.case.law/ny-2d/41/html/0564-01.html
    status: verified
    verified: "2026-10-27"
    news: '\bnuisance\b'
    elements:
      - text: "An interference substantial in nature"
        keys: [substantial]
      - text: "Intentional in origin (or negligent, or from an abnormally dangerous activity)"
        keys: [intentional, intent]
      - text: "Unreasonable in character"
        keys: [unreasonable]
      - text: "With a person's property right to use and enjoy land"
        keys: [use and enjoy, enjoyment, property, land]
      - text: "Caused by another's conduct in acting or failing to act"
        keys: [conduct, caused, failure to act]
    numbers:
    - q: Limitations period for an action for injury to property in NY, CPLR 214(4)
      answer: 3
      unit: years
      cite: N.Y. CPLR 214(4)
    - q: Limitations period for injury to property from the latent effects of exposure to a substance, running from discovery or from when it should have been discovered, whichever is earlier, CPLR 214-c(2)
      answer: 3
      unit: years
      cite: N.Y. CPLR 214-c(2)
    missing:
    - facts: Corbel Ironworks' forge across the road is ordinarily inaudible inside the Haddens' rented house. One afternoon Corbel ran a twenty-minute test of a new power hammer, knowing it would be loud and
        without warning anyone; it never ran the test again. The Haddens sued over that afternoon.
      missing: 0
      why: A single, brief burst of noise that never recurs is not a substantial interference.
    cases:
    - name: Boomer v. Atlantic Cement Co.
      cite: 26 N.Y.2d 219, 228 (1970)
      url: https://static.case.law/ny-2d/26/html/0219-01.html
      holding: Where a cement plant was a nuisance but an injunction would shut a major plant, the court granted an injunction that would be vacated once the plant paid the neighbors permanent damages.
      element: null

