  - id: cplr3212
    area: practice
    family: elements
    title: CPLR 3212 — summary judgment burdens
    jurisdiction: NY
    cite: N.Y. CPLR 3212(b); Alvarez v. Prospect Hosp., 68 N.Y.2d 320, 324 (1986); Zuckerman v. City of New York, 49 N.Y.2d 557, 562 (1980)
    source: https://www.nysenate.gov/legislation/laws/CVP/3212
    openleg:
    - CVP/3212
    status: verified
    verified: '2026-11-04'
    news: \bsummary judgment\b
    news_ny: true
    note: If the movant misses its prima facie showing, the motion fails however weak the opposition (Alvarez). The court may search the record and grant judgment to a non-moving party without a cross-motion
      (3212(b)).
    elements:
    - text: The movant makes a prima facie showing of entitlement to judgment as a matter of law, with evidence showing no material issue of fact
      keys:
      - prima facie
      - entitlement
      - matter of law
      - no material issue
    - text: The burden then shifts to the opponent to produce evidentiary proof in admissible form showing a material issue of fact that needs a trial
      keys:
      - burden shifts
      - shift
      - admissible form
      - triable issue
      - issue of fact
    - text: Conclusions, hopes or unsubstantiated allegations do not raise an issue (absent an acceptable excuse for the lack of admissible proof)
      keys:
      - conclusory
      - mere conclusions
      - unsubstantiated
      - expressions of hope
    cloze:
      text: Except as provided in subdivision (c) of this rule the motion shall be denied if any party shall show facts sufficient to require ___.
      answer: a trial of any issue of fact
      accept:
      - a trial of any issue of fact
      - a trial
      - trial of any issue of fact
      source: https://www.nysenate.gov/legislation/laws/CVP/3212
    missing:
    - facts: Fernwhistle Marine moves for summary judgment in a dock-collapse suit, supported only by its lawyer's affirmation that the dock was sound; no inspector, deposition or photos. Plaintiff files
        a thin, conclusory response.
      missing: 0
      why: A lawyer's affirmation without personal knowledge has no evidentiary value (Zuckerman), so the movant never made a prima facie showing; the burden never shifts and the motion fails regardless of
        the weak opposition (Alvarez).
    - facts: Bluegill Kayak Rentals moves with inspection reports and deposition excerpts showing the rental boat had no defect. The renter opposes with his own unsworn letter saying the hull "must have"
        been cracked.
      missing: 1
      why: The movant's proof shifted the burden, and an unsworn letter of speculation is not evidentiary proof in admissible form, so the opponent did not meet it.
    cases:
    - name: Alvarez v. Prospect Hosp.
      cite: 68 N.Y.2d 320, 324 (1986)
      url: https://static.case.law/ny-2d/68/html/0320-01.html
      holding: The movant must first show prima facie entitlement to judgment with evidence eliminating material fact issues; only then does the burden move to the opponent to show a triable issue with admissible
        proof.
      element: 0
    - name: Zuckerman v. City of New York
      cite: 49 N.Y.2d 557, 562 (1980)
      url: https://static.case.law/ny-2d/49/html/0557-01.html
      holding: An opponent must come forward with admissible evidence of a material fact issue or an acceptable excuse for not doing so; conclusions and unsupported assertions are not enough.
      element: 1

