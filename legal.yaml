  - id: formation
    area: contracts
    family: elements
    title: Contract formation (NY)
    jurisdiction: NY
    cite: Matter of Express Indus. & Term. Corp. v. N.Y. State Dep't of Transp., 93 N.Y.2d 584, 589–90 (1999); Joseph Martin, Jr., Delicatessen, Inc. v. Schumacher, 52 N.Y.2d 105, 109 (1981); Holt v. Feigenbaum,
      52 N.Y.2d 291, 298–99 (1981)
    source: https://static.case.law/ny-2d/93/html/0584-01.html
    status: verified
    verified: '2026-11-04'
    news: \b(meeting of the minds|mutual assent|agreement to agree|unenforceable (contract|agreement))\b
    news_ny: true
    note: 'Mutual assent is found in the offer and acceptance: courts look first for a sufficiently definite offer whose unequivocal acceptance would bind (Express Indus.). An agreement to agree on a material
      term is unenforceable (Martin Delicatessen). Consideration is a benefit to the promisor or a detriment to the promisee (Holt).'
    elements:
    - text: An offer definite enough on all material terms that its unequivocal acceptance would show mutual assent (an objective meeting of the minds)
      keys:
      - offer
      - definite
      - mutual assent
      - meeting of the minds
      - material terms
    - text: An unequivocal acceptance of that offer
      keys:
      - acceptance
      - accept
      - unequivocal
    - text: 'Consideration: a benefit to the promisor or a detriment to the promisee'
      keys:
      - consideration
      - benefit
      - detriment
      - bargain
    missing:
    - facts: Willow Garage leased its lot to Pell Hardware for five years at $2,000 a month, with an option to renew at a rent "to be agreed." Pell signed and paid every month. At the end of the term the
        parties could not agree on the renewal rent, and Pell sued to enforce the renewal.
      missing: 0
      why: The renewal rent was left to future agreement, so the renewal term was never offered definitely enough to bind; an agreement to agree is unenforceable (Martin Delicatessen).
    - facts: 'Rowan Painting emailed Ferro Cafe a firm quote to repaint its storefront for $900, finished by May 1. Ferro replied the same day: "Agreed, provided you finish by April 24." Rowan never answered.'
      missing: 1
      why: A reply that conditions assent on a changed term is a counteroffer, not an unequivocal acceptance (a sale of goods would go to UCC 2-207 instead).
    cases:
    - name: Matter of Express Indus. & Term. Corp. v. N.Y. State Dep't of Transp.
      cite: 93 N.Y.2d 584, 589–90 (1999)
      url: https://static.case.law/ny-2d/93/html/0584-01.html
      holding: A DOT permit that left material terms open (the security-deposit date and the timing and rent effect of a redemption option) was not an offer definite enough for the tenant's signature to accept,
        so no contract formed.
      element: 0
    - name: Holt v. Feigenbaum
      cite: 52 N.Y.2d 291, 298–99 (1981)
      url: https://static.case.law/ny-2d/52/html/0291-01.html
      holding: Consideration is satisfied by either a benefit to the promisor or a detriment to the promisee; both are not required.
      element: 2

