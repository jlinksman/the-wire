# legal.yaml — legal refresher cards for the Puzzle Page (GAMES.md §4). Public law only.
#
# Rules (approved 2026-10-27):
# - Elements are stated in our own words from primary authority (statute text, controlling cases)
#   and cited. Never PJI, Restatement or bar-prep text. Refreshers, not advice.
# - Every card is labeled NY / federal, carries a "verified" date, and is second-checked against
#   the cited sources before it ships (status: verified). Draft cards never reach the page.
# - One element per review item: each element gets its own schedule.
# - News tie-in: `news` is a regex on story titles; a matching story features the card.
# - Syllabus order: environmental, then torts. Later areas wait for a month of use.
#
# Second check 2026-10-27 (independent reviewer, against statute text on nysenate.gov and Cornell
# LII, and star-paged case copies from the Caselaw Access Project): corrections applied below.
# Still draft: trespass (elements 2–3 need their own NY authority) and CPLR 1411 (amended
# 2026-05-29; confirm the amending chapter's effective date and scope first).
#
# Card fields: id, area, title, jurisdiction, cite, source (URL), verified, status, news,
# note (variants to remember), elements [{text, keys}], optional cloze {text, answer, accept, source}.

cards:
  # ------------------------------------------------------------ NY spill and environmental
  - id: nav181
    area: environmental
    title: "Navigation Law § 181 — strict liability for a petroleum discharge"
    jurisdiction: NY
    cite: "N.Y. Navigation Law §§ 172(8), 181(1), (5); State of New York v. Green, 96 N.Y.2d 403, 405, 407 (2001)"
    source: https://www.nysenate.gov/legislation/laws/NAV/181
    status: verified
    verified: "2026-10-27"
    news: '\b(oil|petroleum|gasoline|fuel|heating oil|diesel) (spill|leak|discharge)|\bspill\b|navigation law'
    news_ny: true          # a NY statute: only New York stories feature it
    elements:
      - text: "A discharge of petroleum"
        keys: [discharge, petroleum, spill, release]
      - text: "The defendant is a discharger (liability is strict, without regard to fault; a discharge includes any intentional or unintentional act or omission, § 172(8); under Green, a landowner who can control activities on its property and has reason to believe petroleum will be stored there is a discharger, but mere ownership is not enough)"
        keys: [discharger, caused, control]
      - text: "Cleanup and removal costs, or direct or indirect damages"
        keys: [cleanup, removal, costs, damages]
    cloze:
      text: "Any person who has discharged petroleum shall be strictly liable, ___, for all cleanup and removal costs and all direct and indirect damages, no matter by whom sustained, as defined in this section."
      answer: "without regard to fault"
      accept: ["without regard to fault", "regardless of fault"]
      source: https://www.nysenate.gov/legislation/laws/NAV/181

  - id: cercla107
    area: environmental
    title: "CERCLA § 107(a) cost recovery — prima facie case"
    jurisdiction: federal
    cite: "42 U.S.C. § 9607(a); B.F. Goodrich Co. v. Murtha, 958 F.2d 1192, 1198 (2d Cir. 1992)"
    source: https://www.law.cornell.edu/uscode/text/42/9607
    status: verified
    verified: "2026-10-27"
    news: '\b(cercla|superfund|hazardous (waste|substance)|contaminat\w+|remediation)\b'
    note: "For a government plaintiff the costs need only be \"not inconsistent with\" the NCP, which puts the burden on the defendant (§ 9607(a)(4)(A) vs (B))."
    elements:
      - text: "The defendant is within one of the four classes of responsible parties"
        keys: [responsible party, prp, owner, operator, arranger, transporter, classes]
      - text: "The site is a facility"
        keys: [facility, site]
      - text: "A release or threatened release of a hazardous substance"
        keys: [release, hazardous]
      - text: "The release caused the plaintiff to incur response costs"
        keys: [response costs, costs, incur]
      - text: "The costs are consistent with the National Contingency Plan"
        keys: [national contingency plan, ncp, contingency]

  - id: cercla_prp
    area: environmental
    title: "CERCLA § 107(a) — the four classes of responsible parties"
    jurisdiction: federal
    cite: "42 U.S.C. § 9607(a)(1)–(4)"
    source: https://www.law.cornell.edu/uscode/text/42/9607
    status: verified
    verified: "2026-10-27"
    news: '\b(cercla|superfund|responsible part(y|ies))\b'
    elements:
      - text: "The current owner or operator of the facility (or vessel)"
        keys: [current owner, current operator, current]
      - text: "The owner or operator at the time of disposal"
        keys: [time of disposal, past owner, former owner, prior owner]
      - text: "Arrangers: those who arranged for disposal or treatment of hazardous substances they owned or possessed"
        keys: [arrange, arranger, generator]
      - text: "Transporters: those who accepted hazardous substances for transport to disposal or treatment sites they selected"
        keys: [transport, transporter, selected]

  - id: cercla107b
    area: environmental
    title: "CERCLA § 107(b) — the statutory defenses"
    jurisdiction: federal
    cite: "42 U.S.C. § 9607(b)"
    source: https://www.law.cornell.edu/uscode/text/42/9607
    status: verified
    verified: "2026-10-27"
    news: '\b(cercla|superfund)\b'
    note: "The defendant proves by a preponderance that the release and resulting damages were caused solely by one of these. Innocent landowner, bona fide prospective purchaser and contiguous owner protections sit elsewhere (§§ 9601(35), 9607(q), (r))."
    elements:
      - text: "An act of God"
        keys: [act of god, god]
      - text: "An act of war"
        keys: [act of war, war]
      - text: "An act or omission of a third party other than an employee or agent, or one in a direct or indirect contractual relationship with the defendant (common-carrier tariff excepted), where the defendant exercised due care and took precautions against foreseeable acts or omissions"
        keys: [third party, unrelated]
      - text: "Any combination of the above"
        keys: [combination]

  - id: rcra7002
    area: environmental
    title: "RCRA § 7002(a)(1)(B) — imminent and substantial endangerment citizen suit"
    jurisdiction: federal
    cite: "42 U.S.C. § 6972(a)(1)(B); Cordiano v. Metacon Gun Club, Inc., 575 F.3d 199, 210–11 (2d Cir. 2009)"
    source: https://www.law.cornell.edu/uscode/text/42/6972
    status: verified
    verified: "2026-10-27"
    news: '\b(rcra|hazardous waste|solid waste|landfill)\b'
    note: "\"Substantial\" means serious (Cordiano). Ninety days' notice before suit, § 6972(b)(2)(A)."
    elements:
      - text: "The defendant is a person (including a past or present generator, transporter, or owner or operator of a treatment, storage or disposal facility)"
        keys: [person, generator, transporter, owner, operator]
      - text: "Who has contributed or is contributing to the past or present handling, storage, treatment, transportation or disposal of solid or hazardous waste"
        keys: [contributed, contributing, handling, disposal, waste]
      - text: "Which may present an imminent and substantial endangerment to health or the environment"
        keys: [imminent, substantial, endangerment]

  - id: cwa301
    area: environmental
    title: "Clean Water Act § 301(a) — unpermitted discharge"
    jurisdiction: federal
    cite: "33 U.S.C. §§ 1311(a), 1362(12); Cordiano v. Metacon Gun Club, Inc., 575 F.3d 199, 215 (2d Cir. 2009)"
    source: https://www.law.cornell.edu/uscode/text/33/1311
    status: verified
    verified: "2026-10-27"
    news: '\b(clean water act|stormwater|wastewater|npdes|discharge permit)\b'
    note: "Sackett v. EPA (2023) narrowed \"navigable waters\"; County of Maui (2020) reaches the functional equivalent of a direct discharge through groundwater."
    elements:
      - text: "A discharge (an addition)"
        keys: [discharge, addition]
      - text: "Of a pollutant"
        keys: [pollutant]
      - text: "To navigable waters"
        keys: [navigable, waters]
      - text: "From a point source"
        keys: [point source]
      - text: "Without a permit (NPDES under § 1342, or § 404 dredge-and-fill under § 1344)"
        keys: [permit, npdes]

