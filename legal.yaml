        keys: [duty]
      - text: "A breach of that duty"
        keys: [breach]
      - text: "Injury proximately resulting from the breach"
        keys: [proximate, cause, causation, injury, damages, harm]

  - id: private_nuisance
    area: torts
    title: "Private nuisance (NY)"
    jurisdiction: NY
    cite: "Copart Industries, Inc. v. Consolidated Edison Co. of N.Y., 41 N.Y.2d 564, 569–70 (1977)"
    source: https://static.case.law/ny-2d/41/html/0564-01.html
    status: verified
    verified: "2026-10-27"
    news: '\bnuisance\b'
    elements:
      - text: "An interference substantial in nature"
        keys: [substantial]
      - text: "Intentional in origin (or negligent, or from an abnormally dangerous activity)"
        keys: [intentional, intent]
      - text: "Unreasonable in character"
        keys: [unreasonable]
      - text: "With a person's property right to use and enjoy land"
        keys: [use and enjoy, enjoyment, property, land]
      - text: "Caused by another's conduct in acting or failing to act"
        keys: [conduct, caused, failure to act]

  - id: trespass
    area: torts
    title: "Trespass to land (NY)"
    jurisdiction: NY
    cite: "Phillips v. Sun Oil Co., 307 N.Y. 328, 331 (1954)"
    source: https://static.case.law/ny/307/html/0328-01.html
    status: draft          # elements 2–3 need their own verified NY authority
    verified: null
    news: '\btrespass\w*\b'
    elements:
      - text: "An intentional entry onto land: the defendant intended the act, and the intrusion was its immediate or inevitable consequence (or followed from negligence amounting to willfulness), the act being substantially certain to result in the entry; for underground migration, the defendant had good reason to know or expect the passage"
        keys: [intentional, intent, entry, enter]
      - text: "Land in the plaintiff's possession"
        keys: [possession, land, property]
      - text: "Without permission or legal right"
        keys: [permission, consent, right, authority]

  - id: abnormally_dangerous
    area: torts
    title: "Abnormally dangerous activity — the factors (NY)"
    jurisdiction: NY
    cite: "Doundoulakis v. Town of Hempstead, 42 N.Y.2d 440, 448 (1977) (identifying Restatement (Second) of Torts § 520 factors as \"particularly useful\"; no single factor determinative)"
    source: https://static.case.law/ny-2d/42/html/0440-01.html
    status: verified
    verified: "2026-10-27"
    news: '\b(blasting|explosives|strict liability)\b'
    note: "These are factors to weigh, not elements; no single factor decides it."
    elements:
      - text: "A high degree of risk of harm"
        keys: [high degree, risk]
      - text: "Likelihood that the harm will be great"
        keys: [great, severity, serious]
      - text: "Inability to eliminate the risk with reasonable care"
        keys: [reasonable care, eliminate]
      - text: "The extent to which the activity is not a matter of common usage"
        keys: [common usage, uncommon]
      - text: "Inappropriateness of the activity to the place where it is carried on"
        keys: [place, location, inappropriate]
      - text: "The extent to which its value to the community is outweighed by its dangerous attributes"
        keys: [value, community, outweigh]

  - id: defamation
    area: torts
    title: "Defamation (NY)"
    jurisdiction: NY
    cite: "Dillon v. City of New York, 261 A.D.2d 34, 38 (1st Dep't 1999)"
    source: https://static.case.law/ad2d/261/html/0034-01.html
    status: verified
    verified: "2026-10-27"
    news: '\b(defam\w+|libel\w*|slander\w*)\b'
    note: "Variants: a private plaintiff on a matter of public concern must show gross irresponsibility (Chapadeau v. Utica Observer-Dispatch, 38 N.Y.2d 196 (1975)); Civil Rights Law § 76-a (2020) requires actual malice for public-forum speech on an issue of public interest."
    elements:
      - text: "A false (and defamatory) statement"
        keys: [false, falsity, defamatory]
      - text: "Published to a third party without privilege or authorization"
        keys: [published, publication, third party]
      - text: "Fault: at least negligence (actual malice for a public figure)"
        keys: [fault, negligence, malice]
      - text: "Special harm, or defamation per se"
        keys: [special harm, special damages, per se]

  - id: slander_per_se
    area: torts
    title: "Slander per se — the four categories (NY)"
    jurisdiction: NY
    cite: "Liberman v. Gelstein, 80 N.Y.2d 429, 435 (1992)"
    source: https://www.law.cornell.edu/nyctap/080_0429.htm
    status: verified
    verified: "2026-10-27"
    news: '\b(defam\w+|slander\w*)\b'
    note: "The law presumes damages in these four. \"Serious\" crime excludes minor offenses; Civil Rights Law § 77 codifies the unchastity category."
    elements:
      - text: "Charges the plaintiff with a serious crime"
        keys: [crime, criminal]
      - text: "Tends to injure the plaintiff in a trade, business or profession"
        keys: [trade, business, profession]
      - text: "Imputes a loathsome disease"
        keys: [disease]
      - text: "Imputes unchastity to a woman"
        keys: [unchastity, chastity]

  - id: cplr1411
    area: torts
    title: "Comparative fault — CPLR 1411"
    jurisdiction: NY
    cite: "N.Y. CPLR 1411(a), (b) (as amended, revision of 2026-05-29)"
    source: https://www.nysenate.gov/legislation/laws/CVP/1411
    status: draft          # amended 2026; confirm the chapter's effective date and scope first
    verified: null
    news: '\bcomparative (fault|negligence)\b'
    news_ny: true
    elements:
      - text: "The claimant's own culpable conduct does not bar recovery (§ 1411(a))"
        keys: [not bar, does not bar, no bar]
      - text: "Damages are diminished in proportion to the claimant's share of the culpable conduct"
        keys: [proportion, diminished, reduced]
      - text: "Exception, § 1411(b): in Insurance Law art. 51 (motor vehicle) personal injury actions, a claimant more at fault than the defendant or defendants combined is barred"
        keys: [motor vehicle, article 51, no-fault, greater, modified]
    cloze:
      text: "The amount of damages otherwise recoverable shall be ___ in the proportion which the culpable conduct attributable to the claimant or decedent bears to the culpable conduct which caused the damages."
      answer: "diminished"
      accept: ["diminished", "reduced"]
      source: https://www.nysenate.gov/legislation/laws/CVP/1411
