      element: null

  - id: defamation
    area: torts
    family: elements
    title: "Defamation (NY)"
    jurisdiction: NY
    cite: "Dillon v. City of New York, 261 A.D.2d 34, 38 (1st Dep't 1999)"
    source: https://static.case.law/ad2d/261/html/0034-01.html
    status: verified
    verified: "2026-10-27"
    news: '\b(defam\w+|libel\w*|slander\w*)\b'
    note: "Variants: a private plaintiff on a matter of public concern must show gross irresponsibility (Chapadeau v. Utica Observer-Dispatch, 38 N.Y.2d 196 (1975)); Civil Rights Law § 76-a (2020) requires actual malice for public-forum speech on an issue of public interest."
    elements:
      - text: "A false (and defamatory) statement"
        keys: ["false", falsity, defamatory]
      - text: "Published to a third party without privilege or authorization"
        keys: [published, publication, third party]
      - text: "Fault: at least negligence (actual malice for a public figure)"
        keys: [fault, negligence, malice]
      - text: "Special harm, or defamation per se"
        keys: [special harm, special damages, per se]
    numbers:
    - q: Limitations period for libel or slander in NY, CPLR 215(3)
      answer: 1
      unit: years
      cite: N.Y. CPLR 215(3)
    missing:
    - facts: Gale Hornby, a private shop owner, read a draft blog post falsely calling her a thief. The blogger deleted it unposted and never showed it to anyone; Hornby sued anyway.
      missing: 1
      why: The statement was never published to a third party.
    - facts: The Brant County Ledger reported that Silas Orme was charged in a burglary ring. Both the police blotter and a deputy confirmed it, and an editor checked the copy before it ran; the blotter turned
        out to be wrong.
      missing: 2
      why: On a matter of public concern a private plaintiff must show gross irresponsibility, and careful two-source reporting is not that (Chapadeau).
    cases:
    - name: Chapadeau v. Utica Observer-Dispatch, Inc.
      cite: 38 N.Y.2d 196, 199 (1975)
      url: https://static.case.law/ny-2d/38/html/0196-01.html
      holding: A private plaintiff suing over reporting on a matter of legitimate public concern must prove the publisher acted in a grossly irresponsible manner, judged against responsible news-gathering standards.
      element: 2
    - name: New York Times Co. v. Sullivan
      cite: 376 U.S. 254, 279–80 (1964)
      url: https://static.case.law/us/376/html/0254-01.html
      holding: The First Amendment bars a public official from recovering for a defamatory falsehood about official conduct unless he proves actual malice, meaning knowledge of falsity or reckless disregard
        for the truth.
      element: 2

  - id: slander_per_se
    area: torts
    family: list
    title: "Slander per se — the four categories (NY)"
    jurisdiction: NY
    cite: "Liberman v. Gelstein, 80 N.Y.2d 429, 435 (1992)"
    source: https://www.law.cornell.edu/nyctap/080_0429.htm
    status: verified
    verified: "2026-10-27"
    news: '\b(slander\w*|defamation per se)\b'
    note: "The law presumes damages in these four. \"Serious\" crime excludes minor offenses; Civil Rights Law § 77 codifies the unchastity category."
    elements:
