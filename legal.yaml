# legal.yaml — legal refresher cards for the Puzzle Page (GAMES.md §4). Public law only.
#
# Rules (approved 2026-10-27):
# - Elements are stated in our own words from primary authority (statute text, controlling cases)
#   and cited. Never PJI, Restatement or bar-prep text. Refreshers, not advice.
# - Every card is labeled NY / federal / majority, carries a "verified" date, and is second-checked
#   against the cited sources before it ships (status: verified). Unverified cards never reach
#   the page.
# - One element per review item: each element gets its own schedule.
# - News tie-in: `news` is a regex on story titles; a matching story features the card.
# - Syllabus order: environmental, then torts. Later areas wait for a month of use.
#
# Card fields: id, area, title, jurisdiction, cite, source (URL), verified (YYYY-MM-DD or null),
# status (draft | verified), news, elements [{text, keys: [accepted keywords]}], and optional
# cloze {text (with ___), answer, accept, source}.

cards:
  # ------------------------------------------------------------ NY spill and environmental
  - id: nav181
    area: environmental
    title: "Navigation Law § 181 — strict liability for a petroleum discharge"
    jurisdiction: NY
    cite: "N.Y. Navigation Law § 181(1), (5); State of New York v. Green, 96 N.Y.2d 403 (2001)"
    source: https://www.nysenate.gov/legislation/laws/NAV/181
    status: draft
    verified: null
    news: '\b(oil|petroleum|gasoline|fuel|heating oil|diesel) (spill|leak|discharge)|\bspill\b|navigation law'
    elements:
      - text: "A discharge of petroleum"
        keys: [discharge, petroleum, spill, release]
      - text: "The defendant is a discharger (liability is strict, without regard to fault; under Green an owner who controlled the system and could have prevented the discharge qualifies)"
        keys: [discharger, caused, control, owner]
      - text: "Cleanup and removal costs, or direct or indirect damages"
        keys: [cleanup, removal, costs, damages]
    cloze:
      text: "Any person who has discharged petroleum shall be strictly liable, ___, for all cleanup and removal costs and all direct and indirect damages, no matter by whom sustained."
      answer: "without regard to fault"
      accept: ["without regard to fault", "regardless of fault"]
      source: https://www.nysenate.gov/legislation/laws/NAV/181

