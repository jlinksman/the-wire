# legal.yaml — legal refresher cards for the Puzzle Page (GAMES.md §4). Public law only.
#
# Rules (approved 2026-10-27):
# - Elements are stated in our own words from primary authority (statute text, controlling cases)
#   and cited. Never PJI, Restatement or bar-prep text. Refreshers, not advice.
# - Every card is labeled NY / federal, carries a "verified" date, and is second-checked against
#   the cited sources before it ships (status: verified). Draft cards never reach the page.
# - One element per review item: each element gets its own schedule.
# - News tie-in: `news` is a regex on story titles; a matching story features the card, unless
#   `news_not` matches its title or summary (a story under a neighbouring statute: a CWA § 311
#   response-plan rule is not § 301 or CERCLA; a household hazardous-waste drop-off is not RCRA § 7002).
# - Syllabus order: environmental, then torts. Later areas wait for a month of use.
#
# Second check 2026-10-27 (independent reviewer, against statute text on nysenate.gov and Cornell
# LII, and star-paged case copies from the Caselaw Access Project): corrections applied below.
# Still draft: trespass (elements 2–3 need their own NY authority) and CPLR 1411 (amended
# 2026-05-29; confirm the amending chapter's effective date and scope first).
#
# Card fields: id, area, family (elements / list / factors / rule: the Friday quiz's odd-one-out only
# mixes elements from cards of the same area and family), title, jurisdiction, cite, source (URL), verified, status, news,
# note (variants to remember), elements [{text, keys}], optional cloze {text, answer, accept, source},
# openleg (NY sections to watch; otherwise the source URL's section). A watched section that changes
# after `verified`, or a cloze that no longer matches the statute, holds the card (pipeline/openleg.py).

cards:
  # ------------------------------------------------------------ NY spill and environmental
  - id: nav181
    area: environmental
    family: elements
    title: "Navigation Law § 181 — strict liability for a petroleum discharge"
    jurisdiction: NY
    cite: "N.Y. Navigation Law §§ 172(8), 181(1), (5); State of New York v. Green, 96 N.Y.2d 403, 405, 407 (2001)"
    source: https://www.nysenate.gov/legislation/laws/NAV/181
    openleg: [NAV/181, NAV/172]   # sections watched for amendments (Open Legislation)
    status: verified
    verified: "2026-10-27"
    news: '\b(oil|petroleum|gasoline|fuel|heating oil|diesel|kerosene) (spills?|leaks?|discharges?)\b|\bnavigation law\b'
    news_not: '\b(clean water act|section 311|response plans?)\b'
    news_ny: true          # a NY statute: only New York stories feature it
    note: "Liability is strict, without regard to fault. A discharge includes any intentional or unintentional act or omission (§ 172(8)). Under State v. Green, a landowner who can control activities on its property and has reason to believe petroleum will be stored there is a discharger; mere ownership is not enough."
    elements:
      - text: "A discharge of petroleum"
        keys: [discharge, petroleum, spill, release]
      - text: "The defendant is a discharger"
        keys: [discharger, caused, control]
      - text: "Cleanup and removal costs, or direct or indirect damages"
        keys: [cleanup, removal, costs, damages]
    cloze:
      text: "Any person who has discharged petroleum shall be strictly liable, ___, for all cleanup and removal costs and all direct and indirect damages, no matter by whom sustained, as defined in this section."
      answer: "without regard to fault"
      accept: ["without regard to fault", "regardless of fault"]
      source: https://www.nysenate.gov/legislation/laws/NAV/181

