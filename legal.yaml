    news_ny: true
    note: Pure comparative fault remains the rule for personal injury, property damage and wrongful death generally. The 2026 change in § 1411(b) reaches only personal injury actions subject to Insurance
      Law art. 51 (motor vehicle), where a claimant more at fault than the defendant or the defendants combined recovers nothing. Added by L. 2026, ch. 58, pt. EE (signed May 26, 2026); applies to actions
      commenced on or after May 26, 2026.
