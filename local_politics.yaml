players:
- name: Lee Kyriacou
  role: Mayor of Beacon (since 2020); former at-large council member
  party: Democratic
  why: Chief executive; appoints to council vacancies, boards and administrator; term ends 2027 and the seat is on the 2027 ballot.
  source: https://elections.dutchessny.gov/wp-content/uploads/2024/02/2023-GE-Results-w-Candidate-Totals.pdf
- name: Ben Swanson
  role: Beacon City Administrator (appointed April 2026)
  party: n/a (appointed)
  why: Runs day-to-day operations, drafts the budget with the mayor, negotiates the three city union contracts.
  source: https://highlandscurrent.org/2026/04/08/beacon-names-next-administrator/
- name: Carolyn Bennett Glauda
  role: Beacon Democrats co-chair; Ward 4 Council Member
  party: Democratic
  why: Leads the city committee that has supplied every council member since 2021 while also holding a council seat.
  source: https://beacondemocrats.org/
- name: Rachel Saunders
  role: Beacon Democrats co-chair
  party: Democratic
  why: Co-leads candidate selection for the dominant local party ahead of the 2027 city election.
  source: https://beacondemocrats.org/
- name: Paloma Wake
  role: At-Large Council Member (since 2022)
  party: Democratic / Working Families
  why: Longest continuously serving current council member; top vote-getter citywide in 2025; WFP-endorsed.
  source: https://elections.dutchessny.gov/wp-content/uploads/2025/11/GE25-Official-Summary-Results.pdf
- name: Yvette Valdes Smith
  role: Chair, Dutchess County Legislature; Legislator D16 (Fishkill + Beacon Ward 4)
  party: Democratic
  why: Presides over the 15-10 Democratic legislature and sets committee assignments.
  source: https://www.dutchessny.gov/Chair-Yvette-Valdes-Smith-Announces-Dutchess-County-Legislatures-2026-Committee-Assignments.htm
- name: Molly Rhodes
  role: County Legislator D18 (Beacon Wards 1-3); former Ward 1 council member
  party: Democratic
  why: Beacon's main county legislator; moved from council to legislature in 2025.
  source: https://www.dutchessny.gov/Departments/County-Legislature/Dutchess-County-Legislators.htm
- name: Dan Aymar-Blair
  role: Dutchess County Comptroller; former Ward 4 council member
  party: Democratic
  why: Beacon politician who won countywide twice (2024 special, 2025); audits county finances.
  source: https://www.dutchessny.gov/Departments/Comptroller/Dan-Aymar-Blair-Sworn-In-for-Second-Term-as-Dutchess-County-Comptroller.htm
- name: Sue Serino
  role: Dutchess County Executive
  party: Republican
  why: Top county official; her seat is on the 2027 ballot for a three-year transition term.
  source: https://dutchessny.gov/elected-officials.htm
- name: Anthony Parisi
  role: Dutchess County District Attorney
  party: Democratic
  why: Won the DA office as a Democrat in 2023; seat on the 2027 ballot.
  source: https://elections.dutchessny.gov/wp-content/uploads/2024/02/2023-GE-Results-w-Candidate-Totals.pdf
- name: Michael Dupree
  role: Chair, Dutchess County Democratic Committee (since 2022)
  party: Democratic
  why: Leads county Democratic organization and endorsements; committee raised over $200k itemized in 2026.
  source: https://www.dutchessdems.com/about
- name: Michael McCormack
  role: Chair, Dutchess County Republican Committee
  party: Republican
  why: Leads county GOP and its candidate convention; oversees a Beacon unit with an acting chair.
  source: https://dutchessgop.com/republican-chairs/
- name: Rob Rolison
  role: State Senator, District 39 (covers Beacon); former Poughkeepsie mayor
  party: Republican
  why: Beacon's state senator; faces Democrat Lisa Kaul on Nov 3, 2026.
  source: https://highlandscurrent.org/2026/10/22/whos-on-the-ballot-2026/
- name: Jonathan Jacobson
  role: Assemblymember, District 104 (covers Beacon)
  party: Democratic
  why: Beacon's Assembly member; unopposed in 2026.
  source: https://highlandscurrent.org/2026/10/22/whos-on-the-ballot-2026/
- name: Randy Casale
  role: Former Mayor of Beacon; 2019 mayoral nominee
  party: Republican / Independence lines (2019)
  why: Last candidate to contest a Beacon mayoral race on a ballot line; his committee remains active.
  source: https://elections.dutchessny.gov/wp-content/uploads/2020/04/GE-2019-Certification.pdf
