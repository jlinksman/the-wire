      independent_file: 2027-05-18 to 2027-05-25
      basis: 'Computed from statute. Designating: signatures no earlier than 37 days before the last filing day (§6-134(4)), so Feb 23, 2027; filing the 13th Monday through the 12th Thursday before the
        June 22 primary (§6-158(1)), so Mar 29 to Apr 1; Wilson-Pakula and acceptances due Apr 5 (§§6-120(3), 6-158(2)). Independent: filing 24 to 23 weeks before Nov 2 (§6-158(9)), so May 18 to 25; first
        signature Apr 13 (§6-138(4)); accept or decline by May 28 (§6-158(11)). 2026 used one-year exceptions; confirm against the State BOE''s 2027 calendar.'
