# Beacon and Dutchess politics (2026-10-26). Public records and local reporting; every fact sourced. Second-checked Oct 26
# (112 confirmed, 14 corrected in local politics; 44 confirmed, 10 corrected in the independent path).
# People appear only in public roles. Nothing here describes Joe's views.
meta:
  as_of: '2026-10-26'
  scope: City of Beacon and Dutchess County, NY
  method: Dutchess BOE certified results (PDF, OCR where scanned), NYS BOE campaign finance open data (data.ny.gov), city/county/party websites, The Highlands Current, A Little Beacon Blog, Hudson Valley
    Press, City & State
  confidence_key:
    verified: Read directly in a primary record or reputable report dated 2025-2026
    dated: Source is reliable but older than 2025; may be stale
    projected: Computed from statute or prior-year offsets; not yet published
