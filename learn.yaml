# Get up to speed (2026-10-25): topics from the questionnaires, each with curated resources in four
# formats (video, article, podcast, deep dive), picked for quality and balance from reputable outlets,
# each link opened and checked when added. Statements point here through their `topic`. Perspective
# labels are The Wire's. Refresh a topic when its story moves. Shipped as data.learn.
topics:
  ny_utilities:
    title: Your utility bill and who should own the grid
    resources:
    - format: video
      title: The Real Reason Electric Rates are Rising
      outlet: EnergySage (Plugged In)
      url: https://www.youtube.com/watch?v=JsW-8hgZAdM
      minutes: 9
      date: 2025-05
      perspective: center
      paywall: false
      why: Plain explanation of rate cases and why investor-owned utilities earn more by spending more on the grid.
    - format: article
      title: State lawmaker proposes new public utility company to replace Central Hudson
      outlet: Spectrum News (Capital Tonight)
      url: https://spectrumlocalnews.com/nys/central-ny/politics/2025/08/27/state-lawmaker-proposes-new-public-utility-company-to-replace-central-hudson
      minutes: 4
      date: 2025-08
      perspective: neutral
      paywall: false
      why: Shrestha's public-power pitch and Central Hudson's reply, including the roughly $60M a year in local taxes it says towns would lose.
    - format: article
      title: Keeping Power Utilities in Corporate Hands Doesn't Make Sense
      outlet: Jacobin
      url: https://jacobin.com/2025/12/hudson-valley-public-power
      minutes: 10
      date: 2025-12
      perspective: left
      paywall: false
      why: The strongest case for a Hudson Valley Power Authority buying out Central Hudson.
    - format: article
      title: State Legislators Should Reject Government Takeovers of Utilities
      outlet: Citizens Against Government Waste
      url: https://www.cagw.org/state-legislators-should-reject-government-takeovers-utilities/
      minutes: 5
      date: 2025-02
      perspective: right
      paywall: false
      why: 'The case against the Hudson Valley Power Authority Act: buyout cost, debt and TVA comparisons.'
    - format: podcast
      title: A Public Utility for New York's Hudson Valley (Local Energy Rules, ep. 227)
      outlet: Institute for Local Self-Reliance
      url: https://www.youtube.com/watch?v=ZuV8pI6e16Y
      minutes: 37
      date: 2025-07
      perspective: left
      paywall: false
      why: Long interview on how a municipal takeover of Central Hudson would actually work, step by step.
    - format: deep
      title: Public Power Push Spreads to the Hudson Valley
      outlet: New York Focus
      url: https://nysfocus.com/2024/05/16/central-hudson-public-power-sarahana-shrestha
      minutes: 12
      date: 2024-05
      perspective: center-left
      paywall: false
      why: Reported background on Central Hudson's billing failures, its rate history and how the public-power bill came about.
