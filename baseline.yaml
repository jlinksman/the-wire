# The starting questionnaire (2026-10-23): what Joe wants to follow, by subject rather than by
# this week's headlines. One answer per subject on a five-point scale; retake any time.
#
# Unlike the pulse, these answers don't fade: they're standing preferences. "A lot" and "Quite
# a bit" add the subject's terms to the more-of vocabulary; "Not much" and "Not at all" add them
# to the less-of vocabulary (pipeline/pulse.py). The page shows the questions shuffled, with no
# hint of their effect; "What it changed" shows it on request.
#
# Habits (kind: habit) change one concrete thing each, named in `effect`.
# Joe's answers live only in Workers KV (quiz.json).

