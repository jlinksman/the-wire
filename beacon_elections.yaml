wards:
  summary: Beacon has 4 wards; each election district is numbered within its ward. NYS BOE labels them "City Beacon WWWEEE" (e.g. 001002 = Ward 1 ED 2); Dutchess results label them "City of Beacon W 1 ED
    2" (2021), "City of Beacon*W 1 ED 2.*" (2023), "C/Beacon W 1 ED 2" (2025); the county apportionment list uses Ward 001/W1 + Dist 002.
  through_2021:
    ward_1:
    - W1 ED1
    - W1 ED2
    ward_2:
    - W2 ED1
    - W2 ED2
    - W2 ED3
    ward_3:
    - W3 ED1
    - W3 ED2
    - W3 ED3
    ward_4:
    - W4 ED1
    - W4 ED2
    note: 10 EDs in 2018 (enrollment), 2020 (enrollment) and 2021 (results). W3 ED3 is a tiny district (5 voters in 2018; 1-2 ballots in 2021).
  from_2023:
    ward_1:
    - W1 ED1
    - W1 ED2
    ward_2:
    - W2 ED1
    - W2 ED2
    ward_3:
    - W3 ED1
    - W3 ED2
    ward_4:
    - W4 ED1
    - W4 ED2
    note: 8 EDs in the 2023 and 2025 results (W2 ED3 and W3 ED3 gone). ED boundaries changed between 2021 and 2023, so ED-level comparisons across that break are not like-for-like; ward-level comparisons
      are safer (ward boundaries may also have shifted; not verified).
  county_legislature:
    district_18:
      '2021': Beacon W1 ED1-2, W2 ED1-3, W3 ED1-2 + Town of Fishkill ED 3
      '2023': Beacon W1-W3 (6 EDs) + Town of Fishkill ED 1
      '2025': Beacon W1-W3 (6 EDs) + Town of Fishkill ED 1
    district_16:
      '2021': Beacon W3 ED3, W4 ED1-2 + Town of Fishkill EDs 1,2,4,5,6,15,17
      '2023': Beacon W4 ED1-2 + Town of Fishkill EDs 2,8,9,10
      '2025': Beacon W4 ED1-2 + Town of Fishkill EDs 2,8,9,10
    source: Derived from the ED rows in each year's ED-level results file.
gaps:
- 'NYS BOE enrollment for 2022 and 2025/2026 (dutchess-11012022, dutchess-02202026, etc.) could not be fetched: elections.ny.gov blocks scripted clients with a Cloudflare challenge, and the WebFetch tool
  refused those URLs (they never surfaced in search results). No numbers for those years.'
- 'Enrollment snapshots included: NYS BOE 2018-04-01 (active/inactive/total) and the county apportionment lists 2018-03-30 and 2020-02-21 (active only).'
- '2019 results: only the scanned certification (citywide/district-wide totals); no ED-level breakdown, and no Beacon-only share for county legislator districts 16 and 18.'
- '2023 mayor: the party line for Ruben Simmons is not printed in the source.'
- An unlabeled column in the 2023/2025 ED tables (rotated header) is kept as unlabeled_col.
- Mayor was not on the ballot in 2021 or 2025.
