name = "the-wire-timer"
main = "index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[vars]
REPO = "jlinksman/the-wire"

[triggers]
crons = ["*/15 * * * *", "*/3 * * * *"]   # build timer; push-alert check

# The KV binding (WIRE) is added at deploy time from the WIRE_KV_ID secret, so the
# namespace ID never sits in this public repo. See .github/workflows/deploy-timer.yml.
