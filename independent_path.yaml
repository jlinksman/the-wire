# Engaging without a party in New York (2026-10-26). Public records and local reporting; every fact sourced. Second-checked Oct 26
# (112 confirmed, 14 corrected in local politics; 44 confirmed, 10 corrected in the independent path).
# People appear only in public roles. Nothing here describes Joe's views.
meta:
  as_of: '2026-10-26'
  jurisdiction: City of Beacon, Dutchess County, NY; AD 104; SD 39; County Legislature CLD 16 and CLD 18
