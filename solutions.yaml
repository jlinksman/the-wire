  il_judicial_overhaul:
    title: Courts, judges and the Attorney General
    prompt: How should Israel balance the powers of the courts, the Knesset, the government and the Attorney General?
    instrument: israel
    mechanisms:
    - id: m1
      text: Give elected politicians more say in choosing Supreme Court justices
    - id: m2
      text: Let 61 Knesset members re-pass a law the Supreme Court strikes down
    - id: m3
      text: Split the Attorney General's job into a government legal adviser and a separate chief prosecutor
    - id: m4
      text: Dismiss Attorney General Gali Baharav-Miara
    - id: m5
      text: Pass a Basic Law setting how Basic Laws are made and when courts may strike down laws
    - id: m6
      text: Limit who may petition the High Court
    - id: m7
      text: Bar a Knesset member under criminal indictment from forming a government
    - id: m8
      text: Limit prime ministers to two terms or eight years
    plans:
      likud:
        m1:
          v: 1
          source: https://www.jns.org/feature/israels-political-parties-explained-likud
          note: Levin focused on weakening courts' influence over nominations; continuing this is very likely if Likud wins.
          checked: true
        m3:
          v: 1
          source: https://www.ynetnews.com/article/jhzih8ndd
          note: Split bill (May 2025) by MK Buskila, built on Sa'ar's framework; Sa'ar now runs on Likud's list.
          checked: true
        m4:
          v: 1
