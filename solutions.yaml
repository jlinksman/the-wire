# Your solutions (2026-10-25): issues Joe can write his own fix for, each with a menu of concrete
# policy mechanisms and each candidate's or list's sourced position on them. Public information
# only: Joe's proposals and anything read from them live only in Workers KV (proposals.json).
#
# v: 1 proposes/supports, -1 opposes, 0 mixed or conditional. Coded only from the source; missing
# stays missing; inferred positions say "Proxy" in the note. checked: true = confirmed or corrected
# by an independent second coder (Oct 25); unverified: true = the second coder couldn't open the
# source, and it doesn't count. instrument: which questionnaire's statements share the topic.
version: 2026-10-25.1
issues:
  ny_utilities:
    title: Utility bills
    prompt: What would you do about Hudson Valley utility bills?
    instrument: election
    mechanisms:
    - id: m1
      text: Create a public power authority to buy Central Hudson and run it as a nonprofit utility
    - id: m2
      text: Require a public hearing in the affected region before any utility rate increase is decided
    - id: m3
      text: Suspend state taxes and surcharges on utility bills for a set period
    - id: m4
      text: Cap utility rate increases at inflation, except for safety and reliability work
    - id: m5
      text: Send households one-time state rebate checks to offset energy bills
    - id: m6
      text: Return unspent state clean-energy program money to ratepayers as bill credits
    - id: m7
      text: Bar utilities from charging customers for advertising, lobbying and legal fees
    - id: m8
      text: Limit the profit rate utilities may earn on their investments
    plans:
      Kathy Hochul:
        m4:
          v: 1
          source: https://www.wbng.com/2026/06/19/ny-budget-targets-rising-utility-bills-with-rebates-rate-reforms-tighter-oversight/
          note: Her enacted 2026 budget requires budget-constrained rate plans that generally hold increases to inflation, except for safety and reliability needs.
          checked: true
        m5:
          v: 1
          source: https://insideclimatenews.org/?p=114954
          note: Touts energy rebate checks of up to $200 for 8.2 million households as her answer on bills (Oct. 2026 debate).
          checked: true
        m7:
          v: 1
          source: https://www.governor.ny.gov/news/governor-hochul-unveils-ratepayer-protection-plan-hold-energy-companies-accountable-and-ensure
          note: Her plan has regulators strip corporate advertising, fines and certain legal fees from what ratepayers pay.
          checked: true
      Bruce Blakeman:
        m3:
          v: 1
          source: https://wlea.net/?p=44951
          note: 'Proxy: would permanently end the System Benefit Charge, one bill surcharge; no plan stated for a timed suspension of taxes (June 2026).'
          checked: true
        m5:
          v: 0
          source: https://www.fingerlakes1.com/2026/09/15/blakeman-criticizes-hochul-utility-rebates-promises-50-bill-cut/
          note: Calls the one-time $200 checks an election-year measure too small to offset rising bills; does not say he would end them.
          checked: true
        m6:
          v: 1
          source: https://www.aol.com/news/gop-ny-gov-candidate-blakeman-202858281.html
          note: Would liquidate about $2.4 billion in unspent NYSERDA climate funds and send it back to ratepayers (April 2026).
          checked: true
      Robert G. Rolison:
        m2:
          v: 1
          source: https://www.nysenate.gov/newsroom/press-releases/2025/rob-rolison/senator-rolison-bill-requiring-public-hearings-utility
          note: Sponsors S980, requiring an in-region public hearing at least 90 days before the PSC rules on a rate increase.
          checked: true
        m3:
          v: 1
          source: https://www.nysenate.gov/affordable-energy-not-albany-mandates
          note: 'Sponsors S8463: one-year holiday on utility-bill taxes and surcharges, two years on green-energy charges.'
          checked: true
      Lisa Kaul:
        m1:
          v: 1
          source: https://www.cityandstateny.com/personality/2026/09/lisa-kaul-looks-oust-rolinson-state-senate/416092/
          note: Wants Central Hudson replaced by a nonprofit Hudson Valley Power Authority, citing cheaper public borrowing (Sept. 2026).
          checked: true
      Pat Ryan:
        m2:
          v: 1
          source: https://patryan.house.gov/media/press-releases/following-recommended-decision-central-hudson-rate-case-congressman-pat-ryan
          note: Asked the PSC for public hearings before a final vote on Central Hudson's rate case (May 2024, older source).
          checked: true
        m8:
          v: 1
          source: https://highlandscurrent.org/2026/10/19/challenger-faces-high-bar-to-unseat-ryan/
          note: Has backed legislation that would limit utility company profits (Oct. 2026 profile).
          checked: true
  ny_climate_law:
    title: Climate law
    prompt: What should New York do with its 2019 climate law and its deadlines?
    instrument: election
    mechanisms:
    - id: m1
      text: Repeal the 2019 climate law (CLCPA) and its emissions targets
    - id: m2
      text: Push back the climate law's deadlines while keeping the law
    - id: m3
      text: Delay the ban on gas hookups in new buildings
    - id: m4
      text: Start a cap-and-invest program that charges large polluters for their emissions
    - id: m5
      text: Lift the ban on fracking for natural gas
    - id: m6
      text: Publish what climate-law mandates cost each ratepayer before moving ahead
    - id: m7
      text: Spend more state money up front on heat pumps, electric vehicles and solar
    - id: m8
      text: Make fossil-fuel companies pay into a climate superfund for past emissions
    plans:
      Kathy Hochul:
        m1:
          v: -1
          source: https://policyintegrity.org/publications/detail/new-yorks-climate-law-amendments-usher-in-new-challenges-and-opportunities
          note: Signed May 2026 amendments that changed the law but kept it and its mandatory 2050 target.
          checked: true
        m2:
          v: 1
          source: https://policyintegrity.org/publications/detail/new-yorks-climate-law-amendments-usher-in-new-challenges-and-opportunities
          note: Her 2026 amendments moved the emissions-rule deadline to December 2028 and loosened the 2030 enforcement language.
          checked: true
        m3:
          v: 0
          source: https://www.canarymedia.com/articles/carbon-free-buildings/new-york-pause-gas-ban-rules
          note: State agreed in Nov. 2025 not to enforce the gas ban pending appeal; her office says she remains committed to the law.
          checked: true
        m4:
          v: 0
          source: https://nysfocus.com/2025/12/03/cap-invest-clcpa-lawsuit-hochul-dec-emissions-rules
          note: Once called cap-and-invest a cornerstone, then shelved it and appealed a court order to issue the rules (Dec. 2025).
          checked: true
        m5:
          v: -1
          source: https://ny1.com/nyc/all-boroughs/news/2026/10/20/gubernatorial-candidates-come-out-swinging-over-energy-costs
          note: 'Proxy: mocked Blakeman''s vision of fracking rigs everywhere (Oct. 2026); the source has no explicit statement defending the ban.'
          checked: true
        m8:
          v: 1
          source: https://www.governor.ny.gov/news/governor-hochul-signs-landmark-legislation-creating-new-climate-superfund
          note: Signed the Climate Change Superfund Act in Dec. 2024; later joined James in defending it against the federal suit.
          checked: true
      Bruce Blakeman:
        m1:
          v: 1
          source: https://www.audacy.com/wben/news/blakeman-backs-fracking-but-not-the-clcpa
          note: Would repeal the law, calling it a green energy scam; dismissed Hochul's pause as a stunt (March 2026).
          checked: true
        m3:
          v: 1
          source: https://www.audacy.com/wben/news/blakeman-backs-fracking-but-not-the-clcpa
          note: 'Proxy: says New Yorkers should choose gas or electric in their homes, implying he would undo the gas-hookup ban (March 2026).'
          checked: true
        m4:
          v: -1
          source: https://wlea.net/?p=44951
          note: Would dismantle the state's cap-and-invest carbon mandates (campaign statement, June 2026).
          checked: true
        m5:
          v: 1
          source: https://www.audacy.com/wben/news/blakeman-backs-fracking-but-not-the-clcpa
          note: Calls tapping the Marcellus Shale a must for jobs and lower energy costs.
          checked: true
      Robert G. Rolison:
        m6:
          v: 1
          source: https://www.nysenate.gov/affordable-energy-not-albany-mandates
          note: 'Sponsors S1031: PSC and Comptroller would calculate each ratepayer''s climate-law costs and offset them with a credit.'
          checked: true
        m3:
          v: 1
          source: https://www.nysenate.gov/newsroom/press-releases/2023/rob-rolison/statement-senator-rob-rolison-end-session-accomplishments
          note: 'Proxy: called the 2023 budget''s gas ban particularly destructive for homeowners and small businesses (2023, older source).'
          checked: true
      Lisa Kaul:
        m7:
          v: 1
          source: https://www.cityandstateny.com/personality/2026/09/lisa-kaul-looks-oust-rolinson-state-senate/416092/
          note: Proposes state upfront investment in EVs and HVAC, easier solar permitting, and clean-energy apprenticeships.
          checked: true
      Letitia James:
        m8:
          v: 1
          source: https://stateimpactcenter.org/ag-work/ag-actions/new-york-ag-defended-states-climate-superfund-act
          note: 'Proxy: defends the Climate Superfund Act in court against the federal government, a duty of her office (2025).'
          checked: true
  energy_nuclear_data_centers:
    title: Power supply and data centers
    prompt: Where should New York get the power it needs, and what should it do about data centers?
    instrument: election
    mechanisms:
    - id: m1
      text: Build new state-backed nuclear power plants upstate
    - id: m2
      text: Reopen the Indian Point nuclear plant
    - id: m3
      text: Let host communities decide whether a large data center can be built
    - id: m4
      text: Pause new large data centers statewide for a year
    - id: m5
      text: Make large data centers pay their own grid costs or bring their own power
    - id: m6
      text: Approve new interstate gas pipelines into New York
    - id: m7
      text: Speed permits for solar, batteries and power lines
    - id: m8
      text: Keep building offshore wind farms
    plans:
      Kathy Hochul:
        m1:
          v: 1
          source: https://www.wshu.org/2026-01-13/ny-gov-kathy-hochul-to-double-down-on-affordability-in-state-of-the-state-speech
          note: Wants to more than double the state's nuclear generation as a backbone of reliable power (Jan. 2026).
          checked: true
        m2:
          v: -1
          source: https://www.cityandstateny.com/policy/2026/03/mike-lawler-and-trump-admin-wants-reopen-indian-point/411964
          note: Her office says she will not support reopening Indian Point (March 2026).
          checked: true
        m4:
          v: 1
          source: https://ny1.com/nyc/all-boroughs/politics/2026/07/15/hochul-blakeman-data-center-moratorium
          note: Ordered a one-year halt on new large data centers, citing unknown effects on bills (July 2026).
          checked: true
        m5:
          v: 1
          source: https://ny1.com/nyc/all-boroughs/politics/2026/07/15/hochul-blakeman-data-center-moratorium
          note: Wants large data centers to bring their own power source.
          checked: true
        m6:
          v: 0
          source: https://www.wamc.org/2025-11-07/gov-hochul-oks-key-permit-for-trump-favored-gas-pipeline-in-nyc-north-jersey
          note: Her environmental agency reversed earlier denials and approved NESE pipeline permits in Nov. 2025, citing reliability.
          checked: true
        m8:
          v: 1
          source: https://www.offshorewind.biz/2025/04/17/new-york-governor-i-will-not-allow-this-federal-overreach-to-stand
          note: Vowed to fight the federal halt of Empire Wind 1 to protect jobs and affordable energy (April 2025).
          checked: true
      Bruce Blakeman:
        m1:
          v: 1
          source: https://wlea.net/?p=44951
          note: Supports expanding nuclear power infrastructure; elsewhere suggests exploring small modular reactors (June 2026).
          checked: true
        m2:
          v: 0
          source: https://rocklandtimes.com/2026/08/06/bruce-blakeman-the-run-for-ny-governor/
          note: Blames Indian Point's closure for higher bills but defers to a feasibility study on reopening it.
          checked: true
        m4:
          v: -1
          source: https://ny1.com/nyc/all-boroughs/politics/2026/07/15/hochul-blakeman-data-center-moratorium
          note: Vowed to rescind the moratorium, calling it crazy (July 2026).
          checked: true
        m8:
          v: -1
          source: https://insideclimatenews.org/?p=114954
          note: Called offshore wind farms and solar panels science projects funded by a slush fund (Oct. 2026 debate).
          checked: true
      Thomas DiNapoli:
        m4:
          v: 1
          source: https://www.cityandstateny.com/politics/2026/10/dinapoli-defends-record-medicaid-fraud-comptroller-debate/416380/
          note: Backs Hochul's data center moratorium (Oct. 2026 debate).
          checked: true
      Joseph Hernandez:
        m4:
          v: -1
          source: https://ny1.com/nyc/all-boroughs/politics/2026/10/02/state-comptroller-dinapoli-fends-off-repeated-attacks-in-ny1-debate-joseph-hernandez
          note: 'Opposes the moratorium: the state cannot just hit the brakes for a year (Oct. 2026 debate).'
          checked: true
      Jackie Mary Auringer:
        m2:
          v: 1
          source: https://midhudsonnews.com/2026/10/23/ryan-and-auringer-face-off-at-public-forum/
          note: Says Indian Point should be reopened (Oct. 2026 forum).
          checked: true
      Robert G. Rolison:
        m3:
          v: 1
          source: https://www.yahoo.com/news/politics/articles/ny-state-senate-candidates-data-090557752.html
          note: Says communities should weigh in on whether they want data centers (Sept. 2026 forum).
          checked: true
        m4:
          v: 1
          source: https://www.yahoo.com/news/politics/articles/ny-state-senate-candidates-data-090557752.html
          note: Voted for the one-year statewide data center moratorium.
          checked: true
      Lisa Kaul:
        m3:
          v: 1
          source: https://www.yahoo.com/news/politics/articles/ny-state-senate-candidates-data-090557752.html
          note: Agrees communities should decide; says the region lacks grid capacity and water for hyperscale centers.
          checked: true
        m7:
          v: 1
          source: https://www.cityandstateny.com/personality/2026/09/lisa-kaul-looks-oust-rolinson-state-senate/416092/
          note: Wants solar permitting hurdles cut to expand solar (Sept. 2026).
          checked: true
  ny_housing:
    title: Housing costs
    prompt: What would you do to bring down housing costs in the Hudson Valley?
    instrument: election
    mechanisms:
    - id: m1
      text: Let the state override local zoning to allow apartments near train stations
    - id: m2
      text: Exempt more new housing from state environmental review
    - id: m3
      text: Let towns outside New York City adopt rent stabilization using local affordability data
    - id: m4
      text: Create a state authority that builds and owns permanently affordable housing
    - id: m5
      text: Restrict large investors from buying up single-family homes
    - id: m6
      text: Give landlords tax breaks for keeping units rent-regulated or affordable
    - id: m7
      text: Cut building regulations that raise construction costs
    - id: m8
      text: Give extra state or federal money to towns that approve more housing
    plans:
      Kathy Hochul:
        m1:
          v: 0
          source: https://www.wshu.org/2026-01-13/ny-gov-kathy-hochul-to-double-down-on-affordability-in-state-of-the-state-speech
          note: Her 2023 override plan was shelved; her 2026 streamlining covers only projects that comply with local zoning.
          checked: true
        m2:
          v: 1
          source: https://www.bisnow.com/news/new-york/affordable-housing/hochul-proposes-cutting-red-tape-for-developers-new-tax-incentives-for-rent-stabilized-landlords-132701
          note: Proposed letting qualifying housing skip SEQRA review, saying it is weaponized to block housing (Jan. 2026).
          checked: true
        m5:
          v: 1
          source: https://nystateofpolitics.com/state-of-politics/new-york/politics/2025/01/11/hochul-introduces-housing-proposals-
          note: Proposed a 75-day waiting period and tax-break limits for large investors buying one- and two-family homes (Jan. 2025).
          checked: true
        m6:
          v: 1
          source: https://www.bisnow.com/news/new-york/affordable-housing/hochul-proposes-cutting-red-tape-for-developers-new-tax-incentives-for-rent-stabilized-landlords-132701
          note: Proposed overhauling the J-51 abatement rewarding upgrades in rent-regulated buildings (Jan. 2026).
          checked: true
        m8:
          v: 1
          source: https://www.governor.ny.gov/news/video-audio-photos-rush-transcript-pro-housing-communities-governor-hochul-announces-more-100
          note: Runs Pro-Housing Communities, steering state funding to certified municipalities that commit to growth (Jan. 2025).
          checked: true
      Bruce Blakeman:
        m1:
          v: -1
          source: https://www.wnycstudios.org/podcasts/bl/segments/nassau-county-exec-gov-hochuls-call-more-housing-long-island
          note: Opposed Albany planning Long Island's growth; wants local, negotiated smart growth (Jan. 2023, older source).
          checked: true
      Lisa Kaul:
        m3:
          v: 1
          source: https://www.cityandstateny.com/personality/2026/09/lisa-kaul-looks-oust-rolinson-state-senate/416092/
          note: Supports the REST Act; says municipalities should decide when they face a housing emergency.
          checked: true
        m4:
          v: 1
          source: https://www.cityandstateny.com/personality/2026/09/lisa-kaul-looks-oust-rolinson-state-senate/416092/
          note: Backs the Social Housing Development Act and more state money for affordable housing.
          checked: true
      Pat Ryan:
        m5:
          v: 1
          source: https://patryan.house.gov/media/press-releases/congressman-pat-ryan-delivers-key-hudson-valley-priorities-lower-housing-costs
          note: Voted for the ROAD to Housing package barring investors with over 350 homes from buying more (May 2026).
          checked: true
        m8:
          v: 1
          source: https://patryan.house.gov/media/press-releases/congressman-pat-ryan-delivers-key-hudson-valley-priorities-lower-housing-costs
          note: His PRO Housing Act would fund municipalities to build or convert housing, especially near transit.
          checked: true
      Jackie Mary Auringer:
        m7:
          v: 1
          source: https://highlandscurrent.org/2026/10/19/challenger-faces-high-bar-to-unseat-ryan/
          note: Wants to reduce regulations she says drive up housing and business costs (Oct. 2026).
          checked: true
