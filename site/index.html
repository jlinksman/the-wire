<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Wire">
<title>The Wire</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">THE WIRE<span class="cursor">_</span></div>
  <div class="asof" id="asof">loading…</div>
</header>

<div id="notices"></div>
<div class="today" id="today"></div>

<section class="live" aria-label="Live video">
  <button class="live-toggle" id="live-toggle" aria-expanded="false">
    <span class="live-dot" aria-hidden="true"></span><span class="label">LIVE</span>
    <span class="live-now" id="live-now">Watch a live channel</span>
    <span class="chev" aria-hidden="true">▾</span>
  </button>
  <div class="live-panel" id="live-panel" hidden>
    <div class="player" id="player"></div>
    <div class="channel-groups" id="channels"></div>
  </div>
</section>

<section class="lasthour" id="lasthour" hidden>
  <div class="section-label">LAST HOUR</div>
  <ol id="lasthour-list"></ol>
</section>

<nav class="desks" id="desks" aria-label="Desks"></nav>
<button class="newline" id="newline" hidden></button>

<section class="scoreboard" id="scoreboard" hidden aria-label="Scores and fixtures"></section>
<section class="pinned" id="pinned" hidden aria-label="Beacon, last 48 hours">
  <div class="section-label">BEACON · 48H</div>
  <ol id="pinned-list"></ol>
</section>

<main>
  <ol class="feed" id="feed"></ol>
</main>

<footer id="footer">
  <button class="health-line" id="health-line" aria-expanded="false"></button>
  <div id="health" hidden>
    <table><thead><tr><th>source</th><th>desk</th><th>items</th><th>last ok</th><th>status</th></tr></thead><tbody id="health-rows"></tbody></table>
  </div>
  <div class="fineprint">Headlines and links only. Updated every 15 minutes.</div>
</footer>

<script src="app.js"></script>
</body>
</html>
