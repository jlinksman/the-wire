<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Wire">
<title>The Wire</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button class="brand" id="brand" aria-label="Back to top">THE WIRE<span class="cursor">_</span></button>
  <span class="asof" id="asof">loading…</span>
  <div class="tools">
    <button class="tool status" id="status-btn" aria-label="Source health"><span class="dot" id="status-dot"></span><span id="status-n"></span></button>
    <button class="tool" id="refresh-btn" aria-label="Refresh">↻</button>
    <button class="tool" id="settings-btn" aria-label="Settings">⚙</button>
  </div>
</header>
<button class="newpill" id="newpill" hidden></button>

<main id="view-today" class="view" data-tab="today" aria-label="Today"></main>
<main id="view-beacon" class="view" data-tab="beacon" aria-label="Beacon" hidden></main>
<main id="view-gov" class="view" data-tab="gov" aria-label="Government and law" hidden></main>
<main id="view-world" class="view" data-tab="world" aria-label="World and sports" hidden></main>
<main id="view-live" class="view" data-tab="live" aria-label="Live video" hidden></main>

<!-- One player for the whole app: it moves between the Live tab and a mini-player by CSS
     only, so the stream never reloads while you browse. -->
<div class="player" id="player" hidden>
  <div class="frame" id="frame"></div>
  <div class="pbar">
    <button class="pname" id="pname" aria-label="Open Live tab"></button>
    <button class="psound" id="psound" aria-label="Turn sound on">🔊 Sound</button>
    <a class="pyt" id="pyt" target="_blank" rel="noopener">YouTube ↗</a>
    <button class="pclose" id="pclose" aria-label="Stop video">✕</button>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab" id="grab"><span></span></div>
  <button class="sheet-close" id="sheet-close" aria-label="Close">✕</button>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script src="app.js"></script>
</body>
</html>
