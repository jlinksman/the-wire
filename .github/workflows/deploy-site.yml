name: Deploy site

# Deploys the page and its data function to Cloudflare Pages. Runs only when the
# site code changes (or by hand), so it stays far under Pages' free build limits.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "functions/**"
      - ".github/workflows/deploy-site.yml"
      - ".github/scripts/public-kv.sh"
      - ".github/scripts/build-tatham.sh"
      - ".github/scripts/tatham-bridge.html"
      - ".github/scripts/build-maps.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WIRE_KV_ID: ${{ secrets.WIRE_KV_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Privacy check (nothing about Joe in what ships)
        run: python3 pipeline/privacy_check.py

      - name: Stop if Cloudflare secrets are missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets, then re-run."
          exit 1

      - name: Create the Pages project (first run only)
        run: npx --yes wrangler@4.152.0 pages project create the-wire --production-branch main || echo "Project already exists."

      # Stamp this deploy's version into the page, the service worker and version.json,
      # so every open of the app can tell whether it is running the newest code.
      - name: Stamp the version
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__VERSION__/$V/g" site/index.html site/sw.js
          printf '{"version":"%s","deployed_at":"%s"}\n' "$V" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/version.json
          grep -c "$V" site/index.html site/sw.js

      # Bindings for the Pages Functions: the data in KV (WIRE) and Workers AI (AI) for the
      # Brief me button. Written at deploy time so the KV namespace ID stays in secrets.
      - name: Find the public namespace (Ballot Match's switch only)
        run: bash .github/scripts/public-kv.sh

      - name: Write Pages bindings
        run: |
          cat > wrangler.toml <<EOF
          name = "the-wire"
          pages_build_output_dir = "site"
          compatibility_date = "2026-10-01"

          [[kv_namespaces]]
          binding = "WIRE"
          id = "$WIRE_KV_ID"

          [[kv_namespaces]]
          binding = "PUBLIC"
          id = "$PUBLIC_KV_ID"

          [ai]
          binding = "AI"
          EOF

      # Logic puzzles (GAMES.md): Simon Tatham's collection (MIT), built for the web with a small
      # patch, cached until the build script changes. Never committed to git.
      - name: Restore logic puzzles
        id: tatham
        uses: actions/cache@v4
        with:
          path: site/vendor/puzzles
          key: tatham-${{ hashFiles('.github/scripts/build-tatham.sh', '.github/scripts/tatham-bridge.html') }}

      - name: Set up Emscripten
        if: steps.tatham.outputs.cache-hit != 'true'
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build logic puzzles
        if: steps.tatham.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-tatham.sh site/vendor/puzzles

      # Map shapes (GAMES.md): us-atlas, world-atlas (ISC; Census and Natural Earth, public domain) and
      # Census 2024 cartographic boundaries, turned into SVG paths. Cached until the script changes.
      - name: Restore maps
        id: maps
        uses: actions/cache@v4
        with:
          path: site/vendor/maps
          key: maps-${{ hashFiles('.github/scripts/build-maps.mjs') }}

      - name: Build maps
        if: steps.maps.outputs.cache-hit != 'true'
        run: |
          W="$(mktemp -d)"
          cp .github/scripts/build-maps.mjs "$W/"
          ( cd "$W" && npm init -y >/dev/null && npm install --silent us-atlas@3.0.1 world-atlas@2.0.2 d3-geo@3.1.1 topojson-client@3.1.0 shapefile@0.6.6 )
          mkdir -p "$W/census"
          for f in cb_2024_us_cd119_500k cb_2024_36_cousub_500k; do
            curl -sSL -A "TheWire/1.0 (personal news reader; ${{ github.server_url }}/${{ github.repository }})" -o "$W/$f.zip" "https://www2.census.gov/geo/tiger/GENZ2024/shp/$f.zip"
            python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$W/$f.zip" "$W/census"
          done
          ( cd "$W" && node build-maps.mjs "$GITHUB_WORKSPACE/site/vendor/maps" census )

      - name: Deploy
        run: npx --yes wrangler@4.152.0 pages deploy site --project-name the-wire --branch main --commit-dirty=true

      - name: Show the live bindings (no secret values)
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/the-wire" \
            | python3 -c "import sys,json; c=json.load(sys.stdin)['result']['deployment_configs']['production']; print('KV bindings:', list((c.get('kv_namespaces') or {}).keys())); print('AI bindings:', list((c.get('ai_bindings') or {}).keys()))"
