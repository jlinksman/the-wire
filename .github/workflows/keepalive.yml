name: Keepalive

# GitHub disables scheduled workflows in public repositories after 60 days without
# commits. A tiny monthly commit keeps the 15-minute build running.
on:
  schedule:
    - cron: "17 13 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "Monthly keepalive"
          git push
