name: Deploy build timer

# Deploys the Cloudflare Worker that starts "Build feed" every 15 minutes and checks
# push alerts every 3 minutes (V6).
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-timer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      WIRE_KV_ID: ${{ secrets.WIRE_KV_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Stop if the GitHub dispatch token is missing
        if: env.GH_DISPATCH_TOKEN == ''
        run: |
          echo "::error::Add a GH_DISPATCH_TOKEN repository secret (fine-grained token, Actions read and write on this repo), then re-run."
          exit 1

      - name: Bind the Worker to the KV namespace (ID stays in secrets, not git)
        working-directory: worker
        run: printf '\n[[kv_namespaces]]\nbinding = "WIRE"\nid = "%s"\n' "$WIRE_KV_ID" >> wrangler.toml

      - name: Deploy the Worker
        working-directory: worker
        run: npx --yes wrangler@4.152.0 deploy

      - name: Give the Worker its ntfy topic
        working-directory: worker
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "::warning::No NTFY_TOPIC secret yet. Push alerts stay off (and show as down in source health) until it's added."
          else
            printf '%s' "$NTFY_TOPIC" | npx --yes wrangler@4.152.0 secret put NTFY_TOPIC
          fi

      - name: Give the Worker its GitHub token
        working-directory: worker
        run: printf '%s' "$GH_DISPATCH_TOKEN" | npx --yes wrangler@4.152.0 secret put GH_TOKEN

      - name: Check the token can start a build
        run: |
          code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            echo "::error::GH_DISPATCH_TOKEN can't start builds (HTTP $code): $(cat /tmp/resp)"
            exit 1
          fi
          echo "Token works: build started."
