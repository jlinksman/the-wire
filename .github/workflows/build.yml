name: Build feed

# Every 15 minutes: fetch the enabled sources and write the result to Workers KV.
# The Cloudflare build timer (worker/) starts this on time; GitHub's own schedule
# below is only a backup, because it often runs hours late.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch every source now, ignoring poll intervals"
        type: boolean
        default: false

concurrency:
  group: build-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIRE_CONTACT: ${{ github.server_url }}/${{ github.repository }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WIRE_KV_ID: ${{ secrets.WIRE_KV_ID }}
      # Only an explicit "force" run ignores poll intervals; timer runs stay polite.
      WIRE_FORCE: ${{ inputs.force == true || inputs.force == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fetch state (ETags, poll timers, the rolling 7-day item store) lives in the
      # Actions cache, never in git.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: wire-state-${{ github.run_id }}
          restore-keys: wire-state-

      - name: Fetch follows from Workers KV
        if: env.CLOUDFLARE_API_TOKEN != '' && env.WIRE_KV_ID != ''
        run: |
          npx --yes wrangler@4 kv key get follows.json --namespace-id "$WIRE_KV_ID" --remote > follows.json 2>/dev/null \
            || echo '{"threads":[],"topics":[]}' > follows.json
          python3 -c "import json;d=json.load(open('follows.json'));print(len(d.get('threads',[])),'followed threads,',len(d.get('topics',[])),'topics')" \
            || echo '{"threads":[],"topics":[]}' > follows.json
      - name: Build
        run: python pipeline/build.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: wire-state-${{ github.run_id }}

      - name: Publish data to Workers KV
        if: env.CLOUDFLARE_API_TOKEN != '' && env.WIRE_KV_ID != ''
        run: |
          # The build's timestamp rides along as metadata so the page can ask "anything new?"
          # and get a tiny "not modified" answer between builds.
          npx --yes wrangler@4 kv key put data.json --path dist/data.json --namespace-id "$WIRE_KV_ID" --remote \
            --metadata "{\"v\":\"$(cat dist/version.txt)\"}"
          # Briefing signal, push-alert candidates and thread evidence: written only when their content changed
          # (or every two hours), per dist/publish.txt from the build.
          for key in brief.json alerts.json evidence.json; do
            if [ -f "dist/$key" ] && ! grep -q "^$key=0" dist/publish.txt 2>/dev/null; then
              npx --yes wrangler@4 kv key put "$key" --path "dist/$key" --namespace-id "$WIRE_KV_ID" --remote
            else
              echo "$key unchanged; not written"
            fi
          done

      - name: Note missing Cloudflare setup
        if: env.CLOUDFLARE_API_TOKEN == '' || env.WIRE_KV_ID == ''
        run: echo "::warning::Cloudflare secrets not set yet; built but did not publish."
