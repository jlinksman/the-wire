name: Build feed

# Every 15 minutes: fetch the enabled sources and write the result to Workers KV.
# GitHub may start scheduled runs late under load; the page's "as of" time shows true freshness.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: build-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIRE_CONTACT: ${{ github.server_url }}/${{ github.repository }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WIRE_KV_ID: ${{ secrets.WIRE_KV_ID }}
      # Manual runs ignore poll intervals so a fix can be checked right away.
      WIRE_FORCE: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Fetch state (ETags, poll timers, the rolling 7-day item store) lives in the
      # Actions cache, never in git.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: wire-state-${{ github.run_id }}
          restore-keys: wire-state-

      - name: Build
        run: python pipeline/build.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: wire-state-${{ github.run_id }}

      - name: Publish data to Workers KV
        if: env.CLOUDFLARE_API_TOKEN != '' && env.WIRE_KV_ID != ''
        run: npx --yes wrangler@4 kv key put data.json --path dist/data.json --namespace-id "$WIRE_KV_ID" --remote

      - name: Note missing Cloudflare setup
        if: env.CLOUDFLARE_API_TOKEN == '' || env.WIRE_KV_ID == ''
        run: echo "::warning::Cloudflare secrets not set yet; built but did not publish."
