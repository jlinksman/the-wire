# people.yaml — individual reporters, writers, podcasters and forecasters The Wire follows
# (alongside the outlets in sources.yaml). Joe's picks plus a researched, balanced set
# (2026-10-18). Edit freely: add a person, change a feed, or set enabled: false.
#
# Fields
#   name, role       who they are (role is shown on the page)
#   desk             BEACON | GOV | LAW | WORLD | SPORTS — where their work belongs
#   perspective      for opinion voices only: left | center-left | center | heterodox | cross |
#                    center-right | right | libertarian | international. Used to keep the
#                    "Range of views" and "From people you follow" balanced across sides.
#                    Reporters, forecasters and explainers have none.
#   byline           names to match in the author field of feeds The Wire already reads
#   feeds            their own feeds: {type: rss | podcast | bluesky | youtube, url}
#   beats            city or subject beats their work always belongs to (israel, jewish, paris)
#   search           a Bing News query (also used where a site refuses cloud servers, e.g. *.substack.com)
#                    — for paywalled writers with no free feed (headline and
#                    link only; Bing doesn't confirm the byline, so these are marked "via search")
#   unreachable      why their own channel can't be read from the cloud yet (candidate for the V8 home fetcher)
#   paywall: true    headline, description and link only; never article text
#   no_ai: true      their work never reaches a model (same rule as WSJ)
# Every opinion piece is attributed to its author on the page and in any summary.

