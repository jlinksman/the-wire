# The meme map's bank (2026-10-23, for fun). Built into site/memes.json by pipeline/memes_build.py.
# Inspired by published research on online political subcultures (credited on the results page,
# by title). Placements, cards and readings are The Wire's. Currents that research documents
# but that are defined by racism, fascism or violence are left out entirely, cards and results.
#
# Each take draws 12 questions: 4 from `map` and 1 from each other dimension plus a future.
# Card effects: x (collective -1 .. market +1), y (return -1 .. accelerate +1), anti
# (institutionalist -1 .. anti-establishment +1), ir (0 earnest, 1 ironic-sincere, 2 shitposter),
# cls (culture -1 .. class +1), subj (nation | class | individual), col (committed -1 .. collector
# +1), fun (0 casual, 1 back catalog, 2 niche theory), body (terminally online -1 .. offline/gym +1),
# w (a word for the stacked label). `art` is emoji; `img` names an image in images: (Commons,
# freely licensed, hotlinked with credit); `see` names a link in links: (the real meme format).

sources:
  politigram: {t: "Politigram & the Post-left (2018)", u: "https://joshuacitarella.substack.com/p/politigram-and-the-post-left"}
  ffp: {t: "Forward-Facing Politics catalogue interview (2019)", u: "https://corcoran.gwu.edu/sites/g/files/zaxdzs2941/f/downloads/JoshuaCitarellaCatalogue.pdf"}
  tag: {t: "Tag Yourself (2019)", u: "https://joshuacitarella.substack.com/p/tag-yourself"}
  aeoh: {t: "After the End of History (2019)", u: "https://old.rhizome.org/events/after-the-end-of-history"}
  edeo: {t: "E-deologies, as reported by Jacobin (2024)", u: "https://jacobin.com/2024/11/gen-z-internet-politics-fascism"}
  memetic: {t: "Memetic Histories (2025)", u: "https://joshuacitarella.substack.com/p/memetic-histories"}
  pipeline: {t: "A New Pipeline (2025)", u: "https://joshuacitarella.substack.com/p/a-new-pipeline"}
  mw: {t: "Modern Wisdom interview (2025)", u: "https://singjupost.com/the-dark-subcultures-of-online-politics-joshua-citarella-on-modern-wisdom-transcript/"}
  manos: {t: "Interview magazine on the manosphere (2023)", u: "https://interviewmagazine.com/culture/joshua-citarella-takes-us-into-the-dark-corners-of-the-manosphere"}
  market: {t: "The Online Marketplace of Ideas (2026)", u: "https://joshuacitarella.substack.com/p/the-online-marketplace-of-ideas"}
  luddism: {t: "National Luddism interview (2019)", u: "https://joshuacitarella.substack.com/p/national-luddism"}
  cyber: {t: "Cyber-nihilism interview (2019)", u: "https://joshuacitarella.substack.com/p/cyber-nihilism"}

currents:
  - {id: leftcom, n: "Left-communism and the ultra-left", short: "Leftcom", x: -0.9, y: 0.1, src: tag, d: "Against parties and unions as well as capital. Communization theory, the main left current in the 2019 survey, holds that the next society grows inside this one rather than being built by a vanguard."}
  - {id: socdem, n: "Social democracy, Bernie-era", short: "Social Democrat", x: -0.5, y: 0.0, src: pipeline, d: "Where the 2018 essay starts the left's drift, and where the 2025 pipeline aims to land people: a class politics for the downwardly mobile, a 21st-century social democracy."}
  - {id: postleft, n: "The post-left and anarcho-primitivism", short: "Post-Leftist", x: -0.45, y: -0.9, src: politigram, d: "Anti-civilization: alienation began with farming and the division of labor, not just capitalism. Degrowth, and the hunter-gatherer as the ideal; the first stage of its path is rejecting technology."}
  - {id: lacc, n: "Left-accelerationism and the tech left", short: "Left-Accelerationist", x: -0.6, y: 0.85, src: politigram, d: "Technology as liberation: automate the work and share the output. One of the three accelerationisms in the 2018 catalog."}
  - {id: uacc, n: "U/acc and cyber-nihilism", short: "Cyber-Nihilist", x: 0.0, y: 0.95, src: cyber, d: "Neither left nor right: the process itself, sped up. The 2019 cyber-nihilist interview mixes communization and egoism in cyberpunk theory-memes."}
  - {id: egoist, n: "Egoism (Stirner)", short: "Egoist", x: 0.45, y: -0.1, src: politigram, d: "Amoral individualist anarchism: causes, nations and morals are 'spooks.' In the 2018 essay, the second stage of the post-left path, and an avatar culture built on an 1840s sketch of Stirner."}
  - {id: ancap, n: "Anarcho-capitalism", short: "Ancap", x: 0.9, y: 0.35, src: politigram, d: "Markets without the state: property rights and non-aggression. In the 2018 essay, the start of one of the drift paths it traces."}
  - {id: netstate, n: "Network-state libertarianism", short: "Network-Stater", x: 0.7, y: 0.7, src: manos, d: "Opt-in, startup-style polities and exit over voice: one of the post-2016 right's strands in the 2023 interview."}
  - {id: paleocon, n: "The Zoomer Right and paleoconservatism", short: "Paleocon", x: 0.25, y: -0.5, src: tag, d: "Protectionist, often isolationist, wary of trade deals and troops abroad, and set apart from the neocons and the free-market Tea Party right before it."}
  - {id: trad, n: "Reactionary Catholicism", short: "Trad", x: 0.3, y: -0.9, src: tag, d: "Tradition with a liturgy. The 2019 survey notes it has more traction with American populists than European-style identitarianism."}
  - {id: luddite, n: "Neo-Luddism", short: "Neo-Luddite", x: -0.05, y: -0.8, src: luddism, d: "Defined against transhumanism: slow the machine down. The 2019 interview's subject later moved to the progressive left."}
  - {id: liberal, n: "The mainstream", short: "Liberal", x: 0.1, y: 0.1, src: politigram, d: "Outside the catalog: the window the subcultures define themselves against, and push past."}

dims:
  anti: {t: "Anti-establishment", lo: "Institutionalist", hi: "Anti-establishment", src: mw, d: "Proposed as the axis that matters more now than left and right: whether you trust the institutions and the people who run them."}
  ir: {t: "Irony", lo: "Earnest", hi: "Shitposter", src: ffp, d: "Irony works as a pass: say it as a joke and you don't own it. Repeat a joke long enough and it can become belief (irony poisoning); cringe, by contrast, is sincerity that can't be bought."}
  cls: {t: "Class or culture", lo: "Culture", hi: "Class", src: pipeline, d: "The argument that the parties converged on economics and split on culture, and that politics should be redrawn along class."}
  col: {t: "Collector or committed", lo: "Committed", hi: "Collector", src: mw, d: "Young posters collecting ideologies like Pokémon, stacking flairs and trying combinations until one sticks, versus settling on one."}
  fun: {t: "Funnel depth", lo: "Casual", hi: "Niche theory", src: pipeline, d: "The politicization funnel: come for a familiar guest, dig through the back catalog, end up with niche thinkers."}
  body: {t: "Body politics", lo: "Terminally online", hi: "Offline and gym-pilled", src: manos, d: "The fitness and self-sufficiency world as politics, and the argument that the left's neglect of the body is a missed coalition."}
  subj: {t: "Collective subject", src: memetic, d: "Who 'we' are: the nation (mythic), the class (material), or the free individual at the center of the old compass."}

