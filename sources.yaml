# sources.yaml — The Wire source registry
# Verified from a cloud sandbox on 2026-10-05 (legal sources on 2026-10-14).
# V1 builds only entries with `enabled: true`. Everything else is the roadmap backlog
# (see ROADMAP.md); `enabled` defaults to false when absent.
# `fulltext: true`: the build may read the open article text (never displayed) to write summaries and pull quotes.
#
# status:
#   OK        fetched cleanly with plain HTTP, no JavaScript
#   KEY       free API key required (key_env names the secret); not used in V1
#   DC-BLOCK  blocks cloud/datacenter IPs (Cloudflare/Akamai 403). Not usable from GitHub;
#             recovered later by the V8 home fetcher. Headlines may still arrive via Google News.
#   GEO       geo-blocked outside the host country
#   UNTESTED  not yet checked; url may be null
# type: rss | api | html | pdf_index | youtube_channel | youtube_playlist
# poll: minutes between fetches (V1 runs every 15; skip a source until its poll interval has passed)
# quiet: true = a corroborating source: its items count toward story grouping, ranking and the
#   briefing, but a lone item from it isn't listed on the desks (it shows inside its story).
# scope: local | state | national | world | mixed (mixed = per item: world if the headline names a
#   foreign place, else national). Defaults by section; used by the briefing's category choices.
# no_brief: true = never used as a single-outlet item in a category briefing (filler-heavy feeds).
# fast: true  = eligible for the "Last hour" list in the breaking strip
# short: display name on the page (optional)
# desk: BEACON | GOV | LAW | WORLD | SPORTS (V1 desk tag; defaults by section if absent)
# robots: subscription = the publisher offers this URL as a feed or API to subscribe to,
#   so it is fetched like any feed reader would. Every other source honors robots.txt.
# Bing News search feeds (bing.com/news/search?...&format=rss) are allowed by Bing's robots.txt
#   and carry the publisher's own link and short description. site_feed: true = one publisher
#   (shown under its short name); otherwise each item counts as its own publisher. They run
#   about 7 hours behind, so they corroborate and fill gaps; they're not for breaking news.
#   Google News RSS is NOT used: news.google.com/robots.txt disallows /rss for bots.
# Rule: never invent an endpoint. A null url means "find it before enabling."

beacon:
  - id: beacon_granicus_listing
    name: City of Beacon meetings (Granicus listing)
    type: html
    url: https://cityofbeacon.granicus.com/ViewPublisher.php?view_id=1
    status: OK
    poll: 15
    notes: Every City Council, Planning Board, and ZBA meeting, including upcoming ones with time, Agenda, and Agenda Packet links. No frame-blocking header, so its player is an embed candidate.
  - id: beacon_granicus_agendas
    short: "City of Beacon"
    enabled: true
    desk: BEACON
    robots: subscription
    agendas: true   # also fetch each linked agenda PDF (approved 2026-10-16), parse items, track addresses
    name: Beacon agendas RSS
    type: rss
    url: https://cityofbeacon.granicus.com/ViewPublisherRSS.php?view_id=1&mode=agendas
    status: OK
    poll: 15
  - id: beacon_granicus_minutes
    name: Beacon minutes RSS
    type: rss
    url: https://cityofbeacon.granicus.com/ViewPublisherRSS.php?view_id=1&mode=minutes
    status: OK
    poll: 60
  - id: beacon_wp_media
    short: "City of Beacon"
    enabled: true
    desk: BEACON
    name: City of Beacon new documents (WordPress media API)
    type: api
    url: https://beaconny.gov/wp-json/wp/v2/media?mime_type=application/pdf&orderby=date&order=desc&per_page=50&_fields=date,title,source_url
    status: OK
    poll: 15
    notes: Live feed of every PDF the city uploads (resolutions, hearing notices, RFPs, daily police blotters). Classify by title and filename.
  - id: beacon_wp_posts
    fulltext: true
    short: "City of Beacon"
    enabled: true
    desk: BEACON
    name: City of Beacon news posts
    type: api
    url: https://beaconny.gov/wp-json/wp/v2/posts?per_page=20&_fields=date,title,link,excerpt
    status: OK
    poll: 30
  - id: beacon_police_blotter
    name: Beacon daily police blotter (PDFs)
    type: pdf_index
    url: https://beaconny.gov/wp-content/uploads/YYYY/MM/MM.DD.YYYY.pdf
    status: OK
    poll: 120
    notes: Discover new blotters through beacon_wp_media (titles like 09.23.2026). Uploaded in batches several days late. Parse rows of time, call type, disposition, officer. Never use for alerts.
  - id: beacon_youtube
    name: City of Beacon YouTube
    type: youtube_channel
    channel_id: UCvPpigGwZDeR7WYmw-SuDxg
    status: OK
    poll: 5
    notes: Live detection needs the YouTube Data API (channel RSS omits live and upcoming streams).
  - id: beacon_youtube_playlist_a
    name: Beacon meeting playlist A
    type: youtube_playlist
    playlist_id: PLhEUshaB9yYr8xfNxmalstjUY6bniLsCE
    status: OK
    poll: 60
  - id: beacon_youtube_playlist_b
    name: Beacon meeting playlist B
    type: youtube_playlist
    playlist_id: PLhEUshaB9yYrILGgtwpLmv_m8rY0KP9oW
    status: OK
    poll: 60
  - id: highlands_current
    fulltext: true
    short: "Highlands Current"
    enabled: true
    desk: BEACON
    name: The Highlands Current
    type: rss
    url: https://highlandscurrent.org/feed/
    status: OK
    poll: 30
    notes: Open WordPress API too (https://highlandscurrent.org/wp-json/wp/v2/posts?search=...). Publishes the curated Beacon blotter.
  - id: gnews_beacon
    desk: BEACON
    name: Google News — "Beacon, NY"
    type: rss
    url: https://news.google.com/rss/search?q=%22Beacon%2C+NY%22&hl=en-US&gl=US&ceid=US:en
    status: OK
    poll: 30
    # Off in V1: news.google.com/robots.txt disallows all bots (and names AI crawlers).
    exclude_domains: [realtor.com, zillow.com, redfin.com, legacy.com, maxpreps.com, apartments.com, trulia.com]
    notes: Noisy (real estate listings, obituaries, school sports). Drop exclude_domains; extend the list as junk appears.
  - id: nws_beacon
    short: "NWS"
    enabled: true
    desk: BEACON
    fast: true
    robots: subscription
    name: NWS active alerts for Beacon
    type: api
    url: https://api.weather.gov/alerts/active?point=41.5048,-73.9696
    status: OK
    poll: 5
    notes: Alert source for Beacon safety pushes (V6).
  - id: beacon_schools
    name: Beacon City School District board agendas (BoardDocs)
    type: html
    url: https://go.boarddocs.com/ny/beacon/Board.nsf/Public
    status: DC-BLOCK
    poll: 120
    notes: BoardDocs (CloudFront) returns 403 to cloud servers (2026-10-16). Candidate for the V8 home fetcher. Board meetings stream on YouTube @BCSDBOE (UCUxD5Qj1i__1hCVsPilNjGw), in live_lineup.

