# Terms that highlight an item in V1 when they appear in its headline or description
# Case-insensitive whole-word or whole-phrase match; a trailing * matches a prefix
# (indemnif* matches indemnify, indemnification). Nothing is filtered out. Tune freely.
# A group can also be {terms: [...], skip_desks: [DESK], case_sensitive: true}.
watchlist:
  # Beacon news on the other desks stands out; on the BEACON desk it would match everything.
  beacon_local: {terms: [Beacon, Dutchess, Fishkill, Hudson Highlands], skip_desks: [BEACON], case_sensitive: true}
  environmental: [Navigation Law, Oil Spill Fund, PFAS, PFOS, PFOA, oil spill, petroleum bulk storage, Part 613, brownfield, remediation, CERCLA, RCRA, Superfund, NYSDEC, spill]
  contractors: [indemnif*, Labor Law 240, prevailing wage]
  bankruptcy: [Chapter 11, Chapter 7, bankruptcy]
  aml: [FinCEN, beneficial ownership, Corporate Transparency Act, anti-money laundering, Bank Secrecy Act]
  # Skips the BEACON desk, where zoning is the whole point and would tag everything.
  real_estate_land_use: {terms: [zoning, land use, SEQRA, eminent domain, commercial real estate], skip_desks: [BEACON]}
  courts: [emergency application, shadow docket, stay application]
  bar: [Rules of Professional Conduct, attorney registration, CLE, ethics opinion]

