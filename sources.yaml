# ---------------------------------------------------------------- V6 push alerts (ntfy.sh)
# Rules for phone pushes. The build turns these into a short candidate list; the
# Cloudflare Worker checks NWS directly every 3 minutes, sends at most daily_cap pushes
# a day (New York time), and never sends the same thing twice. The ntfy topic is a
# secret (NTFY_TOPIC), never stored here.
push_alerts:
  daily_cap: 5
  nws:
    url: "https://api.weather.gov/alerts/active?point=41.5048,-73.9696"
    page: "https://forecast.weather.gov/MapClick.php?lat=41.5048&lon=-73.9696"
    # Warnings only (not watches or advisories), plus anything NWS rates Extreme.
    event_pattern: "Warning$"
    always_severity: [Extreme]
  beacon_official:
    sources: [beacon_wp_posts]
    # Whole words; a trailing * matches any ending.
    keywords: [emergency, evacuat*, shelter in place, boil water, water main, gas leak, power outage, road closure, closed until further notice, missing, police activity, hazmat, hazardous, fire, flood, state of emergency, curfew, lockdown]
  geopolitical:
    desks: [WORLD, GOV]
    min_outlets: 3          # distinct outlets on the same story
    window_minutes: 30      # first three reports within this window
    max_age_minutes: 90     # ignore stories older than this when first seen
    keywords: [attack, strike, strikes, missile, invasion, invades, war, troops, explosion, bombing, killed, dead, coup, assassinat*, nuclear, earthquake, tsunami, hostage, terror, shot down, declares, martial law, blockade, ceasefire]

# ---------------------------------------------------------------- "Brief me" (on-demand spoken briefing)
# The build picks the signal (below); the page's Brief me button asks Workers AI to write
# a radio-style briefing from it, only when tapped. Noise patterns drop items by headline.
briefing:
  max_items: 32
  target_words: 260           # about 90 seconds read aloud
  noise_title: "^(opinion|op-ed|letter to the editor|letters?:|watch:|photos?:|quiz|crossword|the cartoon|on the spot|looking back|roots and shoots|5 questions|around town|the week ahead|calendar|sponsored|varsity update|history fest|halloween)|\\b(horoscope|recipe|best deals|review:|podcast)\\b"
  # Local news (e.g. the Highlands Current) makes the briefing when it's about these places or bodies.
  local_pattern: "\\b(Beacon|Dutchess|Fishkill|Wappinger|Newburgh|City Council|Planning Board|Zoning Board|Legislature|Serino|Kyriacou)\\b"
  per_section: {Alert: 4, Beacon: 8, Government: 8, Law: 6, World: 10, Sports: 4}
  # Single-outlet items only make the briefing from these sources (official or primary).
  primary_sources: [beacon_wp_posts, beacon_wp_media, beacon_granicus_agendas, nws_beacon, dutchess_leg_board_minutes, dutchess_leg_committee_minutes, house_bills_week, senate_floor_activity, cl_ny_spill_law, dec_regs, nys_register, cl_ny_court_of_appeals]
  # Briefing categories: All, Local, State, National, World, then these city beats. An item
  # joins a beat when its headline (or, for world items, its description) matches.
  beats:
    paris: {label: Paris, pattern: "\\b(Paris|Parisian|France|French|Macron|Élysée|Elysee|Lyon|Marseille)\\b"}
    israel: {label: Israel, pattern: "\\b(Israel|Israeli|Israelis|Tel Aviv|Jerusalem|Knesset|Netanyahu|Gaza|West Bank|Hezbollah|IDF)\\b"}
  # In the State briefing, single-outlet items about state government rank first.
  state_pattern: "\\b(Albany|Hochul|Legislature|Assembly|state Senate|Senate Majority|Heastie|Stewart-Cousins|DEC|NYSDEC|Comptroller|DiNapoli|Attorney General|Letitia James|state budget|Court of Appeals|PSC|Public Service Commission|MTA|SUNY|Delgado)\\b"
  # A category briefing also uses single-outlet items from that scope, up to this many.
  beat_extra: 14
